<title>다시, 5시 20분</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Overpass:wght@700;800&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: a floor plan of one building lobby beside a dialogue column; the plan dims toward dusk as the 6 PM closing nears. */
:root {
  --bg: #e7eaf1;
  --panel: #f6f7fa;
  --ink: #1a1f2e;
  --muted: #586074;
  --line: #ccd2de;
  --amber: #d98b1c;
  --sign: #1c6a50;
  --sign-ink: #f2f6f1;
  --danger: #b4423a;
  --ok: #2c7a4c;
  --wall: #394054;
  --hall: #dedbd1;
  --room-security: #c3d2e8;
  --room-cafe: #e6d2bb;
  --room-restroom: #cde2dc;
  --room-mail: #d9d1e7;
  --room-gym: #e3d9c4;
  --dusk: #171c48;
  --me: #e9eefb;
  --npc: #ffffff;
  --f-display: 'Bricolage Grotesque', 'IBM Plex Sans KR', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans KR', system-ui, sans-serif;
  --f-sign: 'Overpass', 'Arial Narrow', 'IBM Plex Sans KR', sans-serif;
  --f-mono: 'Overpass Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f121a; --panel: #171b26; --ink: #e6e8ef; --muted: #99a0b3; --line: #2a3142;
    --amber: #eeaa45; --sign: #2c8c69; --sign-ink: #effaf3; --danger: #e0685e; --ok: #5cbf83;
    --wall: #05070c; --hall: #2b2d33;
    --room-security: #26344a; --room-cafe: #3c3127; --room-restroom: #22392f; --room-mail: #322b40; --room-gym: #3a3527;
    --dusk: #04061a; --me: #1f2a44; --npc: #1d2230;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121a; --panel: #171b26; --ink: #e6e8ef; --muted: #99a0b3; --line: #2a3142;
  --amber: #eeaa45; --sign: #2c8c69; --sign-ink: #effaf3; --danger: #e0685e; --ok: #5cbf83;
  --wall: #05070c; --hall: #2b2d33;
  --room-security: #26344a; --room-cafe: #3c3127; --room-restroom: #22392f; --room-mail: #322b40; --room-gym: #3a3527;
  --dusk: #04061a; --me: #1f2a44; --npc: #1d2230;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.app { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 0.85rem; }
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock { font-family: var(--f-mono); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: 6px; background: var(--ink); color: var(--bg); }
.clock.late { background: var(--danger); color: #fff; }
.loop { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.ghost { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
.ghost:hover { border-color: var(--muted); }

.goal { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 6px; padding: 10px 14px; display: grid; gap: 2px; }
.goal strong { font-weight: 700; }
.goal .meta { color: var(--muted); font-size: 0.85rem; }
.goal .wallet b { color: var(--ink); }

main.play { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { main.play { grid-template-columns: minmax(0, 1fr); } }

/* --- map --- */
.mapwrap { display: grid; gap: 10px; min-width: 0; }
.map { position: relative; width: 100%; max-width: 100%; aspect-ratio: 15 / 12; container-type: inline-size; border-radius: 6px; overflow: hidden; background: var(--wall); user-select: none; }
.tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(12, 1fr); }
.t { background: var(--wall); }
.t.hall { background: var(--hall); }
.t.door { background: var(--hall); box-shadow: inset 0 0 0 0.35cqw var(--amber); }
.t.security { background: var(--room-security); }
.t.cafe { background: var(--room-cafe); }
.t.restroom { background: var(--room-restroom); }
.t.mail { background: var(--room-mail); }
.t.gym { background: var(--room-gym); }
.t.entry { background: var(--hall); box-shadow: inset 0 -0.6cqw 0 var(--sign); }
.label { position: absolute; display: grid; place-items: start center; padding-top: 0.6cqw; pointer-events: none; }
.label.far span { background: color-mix(in srgb, var(--sign) 45%, var(--wall)); color: color-mix(in srgb, var(--sign-ink) 55%, transparent); letter-spacing: 0.2em; }
.label span { font-family: var(--f-sign); font-weight: 800; font-size: 1.85cqw; line-height: 1.05; letter-spacing: 0.04em; text-align: center; background: var(--sign); color: var(--sign-ink); padding: 0.4cqw 0.8cqw; border-radius: 0.5cqw; max-width: 96%; white-space: pre-line; }
.sprite { position: absolute; width: calc(100% / 15); height: calc(100% / 12); display: grid; place-items: center; font-size: 4.1cqw; line-height: 1; transition: left 0.12s, top 0.12s; pointer-events: none; }
.sprite.you::after { content: ""; position: absolute; inset: 8%; border-radius: 50%; border: 0.45cqw solid var(--amber); }
.sprite.near { filter: drop-shadow(0 0 0.8cqw var(--amber)); }
.dusk { position: absolute; inset: 0; background: var(--dusk); opacity: 0; pointer-events: none; transition: opacity 0.6s; }
@media (prefers-reduced-motion: reduce) { .sprite, .dusk { transition: none; } }

.pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 40px); gap: 6px; justify-content: center; }
.pad button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; font-size: 1.1rem; }
.pad .up { grid-column: 2; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
.hint { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0; }

/* --- dialogue --- */
.talk { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; height: min(640px, 78vh); }
@media (max-width: 860px) { .talk { height: 520px; } }
.talk .who { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.talk .who b { color: var(--ink); }
.swap { border: 1px solid var(--amber); background: var(--bg); border-radius: 999px; padding: 1px 9px; font-size: 0.78rem; margin-left: 4px; }
.swap:hover { background: color-mix(in srgb, var(--amber) 15%, var(--bg)); }
.log { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.msg { max-width: 92%; padding: 7px 11px; border-radius: 8px; overflow-wrap: anywhere; }
.msg .name { display: block; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
.msg.npc { background: var(--npc); border: 1px solid var(--line); align-self: flex-start; }
.msg.npc .en { font-weight: 500; }
.msg.me { background: var(--me); align-self: flex-end; }
.msg.gesture { align-self: flex-end; font-style: italic; color: var(--muted); background: transparent; border: 1px dashed var(--line); }
.msg.place { align-self: stretch; max-width: 100%; background: var(--sign); color: var(--sign-ink); font-family: var(--f-sign); font-weight: 700; letter-spacing: 0.02em; }
.msg.place .name { color: var(--sign-ink); opacity: 0.75; }
.msg.sys { align-self: center; max-width: 100%; font-size: 0.82rem; color: var(--muted); text-align: center; background: transparent; padding: 2px 6px; }
.msg .ko { display: block; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 0.85rem; }

.controls { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.say { display: flex; gap: 6px; }
.say input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.say button { padding: 0 14px; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.chip.tool { border-color: var(--amber); }
.chip small { color: var(--muted); font-family: var(--f-mono); margin-left: 4px; }
.pointer[hidden] { display: none; }
.pointer { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px dashed var(--amber); border-radius: 6px; }
.pointer p { margin: 0; width: 100%; font-size: 0.8rem; color: var(--muted); }

/* --- overlays --- */
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--dusk) 70%, transparent); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20; }
.sheet { background: var(--panel); color: var(--ink); border-radius: 10px; width: min(620px, 100%); max-height: 88vh; overflow-y: auto; padding: 22px; display: grid; gap: 14px; }
.sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; margin: 0; line-height: 1.1; text-wrap: balance; }
.sheet p { margin: 0; }
.sheet .lead { color: var(--muted); }
.primary { border: 0; background: var(--amber); color: #1a1408; font-weight: 700; padding: 10px 16px; border-radius: 6px; justify-self: start; }
.miss { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.miss li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.tag { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; padding: 1px 7px; border-radius: 4px; justify-self: start; }
.tag.무관 { background: color-mix(in srgb, var(--muted) 20%, transparent); }
.tag.정반대 { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.tag.거의 { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.tag.놓친 { background: color-mix(in srgb, var(--sign) 22%, transparent); color: var(--sign); }
.tag.한국어 { background: color-mix(in srgb, var(--amber) 25%, transparent); }
.miss .act { font-size: 0.85rem; color: var(--muted); }
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vocab div { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 0.85rem; }
.vocab b { font-family: var(--f-sign); letter-spacing: 0.02em; }
.vocab .st { float: right; }
.vocab .mean { display: block; color: var(--muted); font-size: 0.8rem; }
.legend { font-size: 0.8rem; color: var(--muted); }
.phr { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.phr li { font-size: 0.9rem; }
.phr .arrow { color: var(--muted); }
.phr em { font-style: normal; font-weight: 700; color: var(--ok); }
.levels { display: grid; gap: 8px; }
.lvl { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.lvl:hover { border-color: var(--amber); }
.lvl span { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; }
.lvl b { font-family: var(--f-display); font-size: 1.1rem; }
.lvl small { color: var(--muted); font-size: 0.82rem; }
.how { display: grid; gap: 6px; margin: 0; padding-left: 18px; font-size: 0.9rem; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>다시, 5시 20분</h1>
      <p>영어로만 돌아가는 건물에서 같은 오후를 되풀이하며 배우는 게임</p>
    </div>
    <div class="hud">
      <span class="loop" id="loopLabel">1회차</span>
      <span class="clock" id="clock">5:20 PM</span>
      <button class="ghost" id="levelBtn" type="button">상황 선택</button>
      <button class="ghost" id="journalBtn" type="button">단어 도감</button>
    </div>
  </header>

  <section class="goal" aria-live="polite">
    <strong id="goalTitle">목표: 경비실로 가서 지갑을 무사히 되찾기</strong>
    <span class="meta wallet" id="walletDesc">당신의 지갑: <b>갈색</b> · 안에 <b>학생증</b></span>
    <span class="meta" id="goalMeta">경비실은 오후 6시에 문을 닫습니다. 걷기·말하기·몸짓·번역기 모두 시간이 흘러요.</span>
  </section>

  <main class="play">
    <div class="mapwrap">
      <div class="map" id="map" aria-label="건물 1층 지도">
        <div class="tiles" id="tiles"></div>
        <div id="labels"></div>
        <div id="sprites"></div>
        <div class="dusk" id="dusk"></div>
      </div>
      <div class="pad" aria-label="이동">
        <button class="up" type="button" data-dir="0,-1" aria-label="위로">↑</button>
        <button class="left" type="button" data-dir="-1,0" aria-label="왼쪽으로">←</button>
        <button class="down" type="button" data-dir="0,1" aria-label="아래로">↓</button>
        <button class="right" type="button" data-dir="1,0" aria-label="오른쪽으로">→</button>
      </div>
      <p class="hint">방향키 또는 WASD로 이동 (한 칸에 30초). 사람 옆에 서면 말을 걸 수 있어요.</p>
    </div>

    <section class="talk">
      <div class="who"><span>대화 상대: <b id="whoName">없음</b> <span id="whoSwap"></span></span><span id="whereName">로비</span></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="controls">
        <form class="say" id="sayForm" autocomplete="off">
          <input id="sayInput" type="text" placeholder="영어로 말해보세요 (문법은 신경 쓰지 마세요)" aria-label="할 말">
          <button type="submit">말하기</button>
        </form>
        <div class="chips" id="gestures"></div>
        <div class="pointer" id="pointer" hidden></div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
(() => {
const W = 15, H = 12;

};

function mark(word, field) {

}
function scanSeen(text) {
  const t = text.toLowerCase();
  for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) mark(w, 'seen');
}
function scanKnown(text) {
  const t = text.toLowerCase();
  for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) { mark(w, 'seen'); mark(w, 'known'); }
}

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s[0].toUpperCase() + s.slice(1);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function clockStr(t) {
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60);

}

// ---------- rendering ----------
function tileClass(x, y) {
  const ch = MAP[y][x];
  if (ch === '#') return 't';
  if (DOOR[ch]) return 't door';
  if (SLOTS[ch]) return 't ' + S.roomAt[ch];
  if (y === H - 1) return 't entry';
  return 't hall';
}
function renderStatic() {
  const tiles = $('tiles'); tiles.innerHTML = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = document.createElement('div'); d.className = tileClass(x, y); tiles.appendChild(d);
  }
  renderLabels();
}
// Signs are only readable from the doorway; once read they stay readable for this loop.
const DOORS = {};
MAP.forEach((row, y) => [...row].forEach((ch, x) => { if (DOOR[ch]) DOORS[DOOR[ch]] = [x, y]; }));
function readSigns() {
  for (const s in DOORS) {
    const [dx, dy] = DOORS[s];
    if (S.read.has(s) || Math.abs(dx - S.x) + Math.abs(dy - S.y) > 1) continue;
    S.read.add(s);
    const room = ROOMS[S.roomAt[s]];
    place(room.name, `${room.ko} 간판`);
  }
}
function renderLabels() {
  const labels = $('labels'); labels.innerHTML = '';
  for (const s in SLOTS) {
    const [bx, by, bw, bh] = SLOTS[s].box;
    const el = document.createElement('div'); el.className = 'label' + (S.read.has(s) ? '' : ' far');
    Object.assign(el.style, { left: bx / W * 100 + '%', top: by / H * 100 + '%', width: bw / W * 100 + '%', height: bh / H * 100 + '%' });
    el.innerHTML = `<span>${S.read.has(s) ? ROOMS[S.roomAt[s]].sign : '· · ·'}</span>`;
    labels.appendChild(el);
  }
}
function render() {
  const sp = $('sprites'); sp.innerHTML = '';
  const near = nearNpc();

    const d = document.createElement('div'); d.className = 'sprite ' + (cls || '');
    d.style.left = x / W * 100 + '%'; d.style.top = y / H * 100 + '%'; d.textContent = icon; sp.appendChild(d);
  };

// ---------- world ----------
function npcAt(x, y) { for (const id in S.npcs) { const [nx, ny] = S.npcs[id]; if (nx === x && ny === y) return id; } return null; }
function nearAll() {
  return [[0, -1], [1, 0], [0, 1], [-1, 0]].map(([dx, dy]) => npcAt(S.x + dx, S.y + dy)).filter(Boolean);
}
// When two people stand next to you, keep talking to the one you picked.
function nearNpc() {
  const all = nearAll();
  return all.includes(S.talkTo) ? S.talkTo : all[0] || null;
}
function talkTo(id) {
  S.talkTo = id; closePointer(); render();
  if (!S.greeted.has(id) && !S.done) { S.greeted.add(id); greet(id); }
}
function zoneAt(x, y) { const ch = MAP[y][x]; return DOOR[ch] || (SLOTS[ch] ? ch : 'hall'); }
function spend(sec) { S.t += sec; updateSchedule(); render(); if (S.t >= S.end && !S.done && !S.won) setTimeout(fail, 450); }

function updateSchedule() {
  const t = S.t, P = S.npcs, near = nearNpc();
  const free = ([x, y]) => !(S.x === x && S.y === y);
  const office = SLOTS[S.slotOf.security].npc;
  if (!S.guardOnPatrol && !S.patrolDone && S.guardStage < 3 && t >= PATROL[0] && t < PATROL[1] && near !== 'guard') {
    P.guard = free([10, 9]) ? [10, 9] : [4, 9];
    S.guardOnPatrol = true; S.greeted.delete('guard');
    if (S.zone === S.slotOf.security) {
      sys('경비원이 시계를 보더니 사무실 문에 팻말을 걸고 나간다.');
      officeSign();
    } else sys('어디선가 문이 철컥 잠기는 소리가 들린다.');
  }
  if (t >= PATROL[1] && !S.patrolDone) {
    S.patrolDone = true;
    if (S.guardOnPatrol && free(office)) { P.guard = office; S.guardOnPatrol = false; S.greeted.delete('guard'); sys('경비원이 순찰을 마치고 사무실로 돌아간다.'); }
  }
  if (S.guardOnPatrol && S.patrolDone && free(office)) { P.guard = office; S.guardOnPatrol = false; S.greeted.delete('guard'); }
  const wc = SLOTS[S.slotOf.restroom].npc;
  if (!S.janitorMoved && t >= JANITOR_MOVES && near !== 'janitor' && free(wc)) {
    P.janitor = wc; S.janitorMoved = true; sys('청소부가 대걸레를 챙겨 RESTROOM 쪽으로 간다.');
  }
  if (P.grandma && t >= GRANDMA_LEAVES && near !== 'grandma') {
    delete P.grandma; sys('할머니가 "Oh, my TV show!" 하며 서둘러 집으로 돌아간다.');
  }
}
function officeSign() {
  S.sawPatrol = true;
  place('SECURITY OFFICE — On patrol. Back at 5:45 PM.', '경비실 — 순찰 중. 오후 5시 45분에 돌아옵니다.');
}

function move(dx, dy) {
  if (S.done || !overlayClosed()) return;
  const nx = S.x + dx, ny = S.y + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H || MAP[ny][nx] === '#' || npcAt(nx, ny)) return;
  S.x = nx; S.y = ny;
  const z = zoneAt(nx, ny);
  readSigns();
  if (z !== S.zone) { S.zone = z; if (z !== 'hall') enterRoom(z); }
  closePointer();
  spend(COST.move);
  const n = nearNpc();
  if (n && !S.greeted.has(n) && !S.done) { S.greeted.add(n); greet(n); if (n === 'grandma') return; }
  const g = S.npcs.grandma;
  if (S.level === 2 && S.carrying && !S.done && g && Math.abs(g[0] - S.x) + Math.abs(g[1] - S.y) === 1) { const [en, ko] = R.grandma2(new Set(), ''); npcSay('grandma', en, ko); }
}

function enterRoom(slot) {
  const key = S.roomAt[slot], room = ROOMS[key];
  if (key === 'security' && S.guardOnPatrol) officeSign();
  else place(room.place[0], room.place[1]);
  const target = LEVELS[S.level].target, T = ROOMS[target];
  if (key === target || S.visited.has(key)) { S.visited.add(key); return; }
  S.visited.add(key);
  const sec = S.slotOf[target], who = S.level === 1 ? '청소부' : '청소부나 할머니';
  if (S.janitorTold) {
    const opp = (SLOTS[sec].side === 'L' && SLOTS[slot].side === 'R') || (SLOTS[sec].side === 'R' && SLOTS[slot].side === 'L');
    if (opp) miss('정반대', `${room.name}에 들어감`,
      `${who}는 "It's ${SLOTS[sec].dir}."라고 했어요. ${SLOTS[sec].dir}는 '${SLOTS[sec].dirKo}'예요. 당신은 반대쪽에 있는 ${room.name}(${room.ko})에 들어갔어요.`,
      [SLOTS[sec].side === 'L' ? 'left' : 'right']);
    else miss('무관', `${room.name}에 들어감`,
      `알려준 방향은 "${SLOTS[sec].dir}"(${SLOTS[sec].dirKo})였어요. 간판의 ${room.name}은 '${room.ko}'예요. ${T.ko} 간판에는 ${T.name}라고 적혀 있어요.`, S.level === 1 ? ['security office'] : []);
  } else {
    miss('무관', `${room.name}에 들어감`, `간판의 ${room.name}은 '${room.ko}'예요. ${T.ko} 간판에는 ${T.name}라고 적혀 있어요.`, S.level === 1 ? ['security office'] : []);
  }
}

function miss(cat, act, explain, words) { S.mistakes.push({ cat, act, explain, at: clockStr(S.t), words: words || [] }); }

// ---------- understanding ----------
function parse(text) {
  const t = ' ' + text.toLowerCase().replace(/[^a-z0-9' ]/g, ' ') + ' ';
  const has = re => re.test(t);
  const out = new Set();
  if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)) out.add('korean');
  if (has(/\b(hi|hello|hey|excuse me|good (afternoon|evening))\b/)) out.add('greet');
  if (has(/\b(lost|lose|losing|missing|cant find|can't find|dropped|forgot)\b/)) out.add('lost');
  if (has(/\b(wallet|purse)\b/)) out.add('wallet');
  if (has(/\bwhere\b/)) out.add('where');
  if (has(/\bhelp\b/)) out.add('help');
  if (has(/\b(security|guard|office|lost and found)\b/)) out.add('security');
  if (has(/\b(thank|thanks|thx)\b/)) out.add('thanks');
  if (has(/\b(yes|yeah|yep|yup|ok|okay)\b/)) out.add('yes');

    if (I.has('korean')) { miss('한국어', `"${raw}"`, '카페 직원은 한국어를 못 알아들어요.'); return ["Sorry—what? I don't speak... that. What can I get you?", '네? 그 말은… 못 해요. 뭐 드릴까요?', false]; }
    if (S.carrying) return ['Enjoy! Come again!', '맛있게 드세요! 또 오세요!', true];
    const B = S.bOrder, ask = S.bAsk;
    const d = first(I, 'd:'), z = first(I, 's:'), m = first(I, 'm:'), h = first(I, 'h:');
    const got = !!(d || z || m || h);
    if (d) B.drink = d; if (z) B.size = z; if (m) B.milk = m; if (h) B.here = h;
    if (got && raw) S.bSaid.push(raw);
    const Q = {
      drink: ["What would you like? A latte? Hot chocolate? Chai tea?", '뭐로 드릴까요? 라테? 핫초코? 차이 티?', '(She taps the menu board.) Drink? Latte... hot chocolate... chai?'],
      size: ['What size? Small, medium, or large?', '사이즈는요? 작은 거, 중간, 큰 거?', '(She holds up three cups: tiny, middle, big.) Size? Small... medium... large?'],
      milk: ["And what kind of milk? We've got regular, oat, and almond.", '우유는 어떤 걸로요? 일반, 귀리, 아몬드 있어요.', '(She points at three milk cartons.) Milk? Regular... oat... almond?'],
      here: ['For here or to go?', '드시고 가세요, 가져가세요?', '(She holds a mug in one hand and a paper cup in the other.) Here? (mug) Or to go? (paper cup)'],
    };
    const QKO = { drink: '"What would you like?"는 "뭐로 드릴까요?"예요.', size: '"What size?"는 "어떤 크기로요?"예요. small(작은)·medium(중간)·large(큰) 중에 골라야 해요.', milk: '"What kind of milk?"는 "어떤 우유로요?"예요. regular(일반)·oat(귀리)·almond(아몬드) 중에 골라야 해요.', here: '"For here or to go?"는 "드시고 가세요, 가져가세요?"예요. 할머니께 가져가려면 to go라고 해야 해요.' };
    if (!got) {
      if (I.has('confused') && ask) return [Q[ask][2], Q[ask][1], true];
      if (ask && (I.has('yes') || I.has('no'))) {
        miss('무관', `"${raw}"`, `${QKO[ask]} yes나 no로는 답할 수 없어요.`, ask === 'here' ? ['to go', 'for here'] : [ask === 'drink' ? 'milk' : ask]);
        return [`Sorry, I mean... ${Q[ask][0]}`, Q[ask][1], false];
      }
      if (I.has('coffee')) return ["Sure! What kind? We've got lattes, hot chocolate, chai tea, americanos...", '그럼요! 어떤 걸로요? 라테, 핫초코, 차이 티, 아메리카노…', true];
      if (I.has('greet')) return [`Hi hi! ${Q[ask || 'drink'][0]}`, `안녕하세요! ${Q[ask || 'drink'][1]}`, true];
      if (ask) miss('무관', `"${raw}"`, `카페 직원은 이렇게 물었어요. ${QKO[ask]}`, ask === 'here' ? ['to go', 'for here'] : []);
      return [`Sorry, it's super busy. ${Q[ask || 'drink'][0]}`, `죄송해요, 지금 너무 바빠서요. ${Q[ask || 'drink'][1]}`, false];
    }
    const next = ['drink', 'size', 'milk', 'here'].find(k => !B[k]);
    const heard = [B.size, B.drink].filter(Boolean).join(' ') + (B.milk ? ` with ${B.milk} milk` : '');
    if (next) { S.bAsk = next; return [`${heard ? cap(heard) + ', got it. ' : 'Got it. '}${Q[next][0]}`, `${heard ? '알겠어요. ' : '네. '}${Q[next][1]}`, true]; }
    S.carrying = { ...B }; S.bAsk = null; S.t += COST.coffee;
    S.phrases.push([S.bSaid.join(' / '), `Can I get ${orderEn(B)} to go, please?`]);
    const mug = B.here === 'here' ? ' (She hands you a heavy ceramic mug.)' : ' (She hands you a paper cup with a lid.)';
    return [`One ${B.size} ${B.drink} with ${B.milk} milk, ${B.here === 'here' ? 'for here' : 'to go'}. Coming right up! ... Here you go!${mug}`,
      `${orderKo(B)} 하나, ${B.here === 'here' ? '드시고 가시는 걸로' : '포장으로'}. 바로 나갑니다! … 여기요!${B.here === 'here' ? ' (무거운 머그잔을 건네준다)' : ' (뚜껑 덮인 종이컵을 건네준다)'}`, true];
  },
  barista(I, raw) {
    if (I.has('korean')) return ["Sorry—what? I don't speak... that. What can I get you?", '네? 그 말은… 못 해요. 뭐 드릴까요?', false];
    if (I.has('wallet') || I.has('lost')) {
      return [`Oh no! Lost-and-found stuff goes to the security office, I think. It's ${SLOTS[S.slotOf.security].dir}. Sure you don't want a latte first?`, `어머! 분실물은 경비실로 가는 것 같아요. ${SLOTS[S.slotOf.security].dirKo}에 있어요. 라테 먼저 안 드실래요?`, true];
    }
    if (I.has('coffee') || I.has('yes')) {
      S.t += COST.coffee;
      miss('무관', '커피를 주문함', '목표와 상관없이 커피를 샀어요. 맛은 있었지만 3분이 흘렀어요. 카페 직원은 늘 뭔가를 팔려고 해요!');
      return ['One pumpkin spice latte, coming right up! ... Here you go! Have a great one!', '호박 스파이스 라테 하나 바로 나갑니다! … 여기요! 좋은 하루 되세요!', true];
    }
    if (I.has('confused')) return ['Sorry! What. Can. I. Get. You? (She taps the menu.) Coffee?', '죄송해요! 뭐. 드릴. 까요? (메뉴판을 톡톡 치며) 커피?', true];
    if (I.has('greet')) return ["Hi hi! What'll it be?", '안녕하세요! 뭐로 하실래요?', true];
    return ["Sorry, it's super busy right now. What can I get you?", '죄송해요, 지금 너무 바빠서요. 뭐 드릴까요?', false];
  },
};

function deliver() {
  const o = S.order, c = S.carrying, wrong = [];
  for (const [k, label, names] of [['drink', '음료', DRINKS], ['size', '크기', SIZES], ['milk', '우유', MILKS]]) {
    if (c[k] !== o[k]) {
      wrong.push(k);
      miss('거의 맞음', `${label}: ${c[k]}`, `할머니는 ${o[k]}(${names[o[k]]})를 부탁했어요. 당신은 ${c[k]}(${names[c[k]] || '메뉴에 없던 것'})를 주문했어요.`, [o[k], k === 'size' ? 'size' : 'milk'].filter(w => VOCAB.some(v => v[0] === w)));
    }
  }
  if (c.here === 'here') { wrong.push('here'); miss('정반대', '"for here"로 주문함', '"For here"는 "여기서 마실게요"예요. 들고 나가려면 "to go"(포장)라고 해야 했어요. 그래서 머그잔에 담아줬어요.', ['to go', 'for here']); }
  if (!wrong.length) { S.won = true; setTimeout(win, 700); return [`Oh, ${orderEn(o)}! Exactly what I wanted. You're an angel, sweetie!`, `어머, ${orderKo(o)}! 딱 내가 원하던 거야. 넌 천사구나!`, true]; }
  S.failTitle = '할머니가 고개를 갸웃했다.';
  setTimeout(fail, 900);
  const mug = c.here === 'here' ? " And oh my, that's the café's mug! We'll have to take it back." : '';
  return [`Oh, thank you, dear... but I asked for ${orderEn(o)}.${mug} Never mind, I'll go myself tomorrow.`, `고마워… 그런데 난 ${orderKo(o)}를 부탁했었단다.${mug ? ' 어머, 그건 카페 머그잔이잖니! 돌려줘야겠다.' : ''} 괜찮아, 내일 내가 가지 뭐.`, true];
}

function act(I, raw, cost, meText, meKind) {
  if (S.done || !overlayClosed()) return;
  const id = nearNpc();
  if (!id) { sys('말을 걸 사람이 없어요. 사람 옆으로 가보세요.'); return; }
  push(meKind, esc(meText));
  const fn = S.level === 2 && R[id + '2'] ? R[id + '2'] : R[id];
  const [en, ko, ok] = fn(I, raw);
  npcSay(id, en, ko);
  if (ok && meKind === 'me') {
    const t = raw.toLowerCase();
    for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) { mark(w, 'seen'); mark(w, 'used'); }
  }
  spend(cost);
}

    else if (!S.carrying) {
      items.push({ cat: '놓친 정보', act: '할머니의 부탁', explain: `할머니는 "${orderEn(o)}, to go"라고 했어요. ${orderKo(o)}, 포장이라는 뜻이에요. 카페 간판은 DAILY GRIND · COFFEE예요.`, at: clockStr(S.t), words: [o.size, 'milk', 'to go', 'favor'] });
      if (S.bAsk && S.bAsk !== 'drink') items.push({ cat: '놓친 정보', act: '카페 직원의 질문', explain: { size: '"What size?"는 "어떤 크기로요?"예요.', milk: '"What kind of milk?"는 "어떤 우유로요?"예요.', here: '"For here or to go?"는 "드시고 가세요, 가져가세요?"예요.' }[S.bAsk], at: clockStr(S.t), words: [S.bAsk === 'here' ? 'to go' : S.bAsk] });
    }
  }
  if (S.level === 1 && S.guardStage === 0 && !S.mistakes.some(m => m.words.includes('security office'))) {
    items.push({ cat: '무관', act: '경비실에 도착하지 못함', explain: '경비실은 간판에 SECURITY OFFICE라고 적혀 있어요. security는 보안·경비, office는 사무실이에요. 모르면 청소부(🧹)에게 물어보거나 할머니(👵)에게 단어를 물어보세요.', at: '6:00 PM', words: ['security office', 'security', 'office'] });
  }
  if (S.level === 1 && S.guardStage === 1 && !items.some(m => m.words.includes('color'))) {
    items.push({ cat: '무관', act: '경비원의 질문에 답하지 못함', explain: '"What does it look like? What color is it?"는 "어떻게 생겼어요? 무슨 색이에요?"예요. 같은 색 물건을 가리키기만 해도 통했어요.', at: '6:00 PM', words: ['color', 'look like'] });
  }
  if (S.level === 1 && S.guardStage === 2 && !items.some(m => m.words.includes('inside'))) {
    items.push({ cat: '무관', act: '안에 든 것을 말하지 못함', explain: `"What's inside it?"는 "안에 뭐가 들었어요?"예요. ${CONTENTS[S.content].ko}은 ${CONTENTS[S.content].en}이고, 시늉으로도 보여줄 수 있었어요.`, at: '6:00 PM', words: ['inside'] });
  }
  if (S.sawPatrol && S.level === 1) {

  }
  items.forEach(m => m.words.forEach(w => { mark(w, 'seen'); mark(w, 'known'); }));

function win() {
  if (S.done) return; S.done = true;
  if (!cleared.includes(S.level)) { cleared.push(S.level); store.set('ag520.cleared', cleared); }
  const used = Math.round((S.t - START) / 60);
  const phr = S.phrases.map(([said, model]) => `<li>"${esc(said)}" <span class="arrow">→ 더 자연스럽게</span> <em>${esc(model)}</em></li>`).join('');
  show(`
    <h2>${S.level === 1 ? '지갑을 되찾았다!' : '할머니가 활짝 웃었다!'}</h2>
    <p class="lead">${S.loop}회차 · ${used}분 사용 · 실수 ${S.mistakes.length}번</p>
    <p>당신의 말은 통했어요. 다음엔 이렇게 말해보세요.</p>
    <ul class="phr">${phr || '<li>몸짓만으로 해냈어요! 다음엔 한 단어라도 영어로 말해보세요.</li>'}</ul>
    <p><b>다른 상황도 해보세요.</b></p>
    ${levelButtons()}`, bindLevels);
}

function showJournal() {
  const st = w => { const j = journal[w] || {}; return j.used ? '✋' : j.known ? '💡' : j.seen ? '👀' : ''; };
  const cells = VOCAB.filter(([w]) => journal[w] && journal[w].seen).map(([w, ko]) => {
    const j = journal[w];
    return `<div><span class="st">${st(w)}</span><b>${esc(w)}</b><span class="mean">${j.known || j.used ? esc(ko) : '뜻: ???'}</span></div>`;
  }).join('');
  const n = VOCAB.filter(([w]) => journal[w] && journal[w].seen).length;
  show(`
    <h2>단어 도감</h2>
    <p class="lead">지금까지 ${n}개의 단어를 만났어요 · 누적 ${totalLoops}회차</p>
    <p class="legend">👀 본 적 있음 · 💡 뜻을 알게 됨 (번역기, 할머니, 주마등) · ✋ 직접 써서 통함</p>
    <div class="vocab">${cells || '<p>아직 만난 단어가 없어요. 건물 안을 돌아다녀 보세요.</p>'}</div>
    <button class="primary" id="close" type="button">닫기</button>`, () => $('close').addEventListener('click', hide));
}
$('journalBtn').addEventListener('click', () => { if (overlayClosed()) showJournal(); });
$('overlay').addEventListener('keydown', e => { if (e.key === 'Escape' && $('close')) hide(); });

newLoop();
intro();
})();
</script>
