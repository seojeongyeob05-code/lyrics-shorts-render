.t.restroom { background: var(--room-restroom); }

.sprite.you::after { content: ""; position: absolute; inset: 8%; border-radius: 50%; border: 0.45cqw solid var(--amber); }

.dusk { position: absolute; inset: 0; background: var(--dusk); opacity: 0; pointer-events: none; transition: opacity 0.6s; }

.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let journal = store.get('ag520.journal', {});
let totalLoops = store.get('ag520.loops', 0);
function mark(word, field) {
  const j = journal[word] || (journal[word] = {});
  if (!j[field]) { j[field] = true; store.set('ag520.journal', journal); }
}
function scanSeen(text) {
  const t = text.toLowerCase();
  for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) mark(w, 'seen');
}
function scanKnown(text) {
  const t = text.toLowerCase();
  for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) { mark(w, 'seen'); mark(w, 'known'); }
}

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

function clockStr(t) {

}

let S = null;
function newLoop() {
  const prevSec = S ? S.slotOf.security : null;

  do { order = shuffle(Object.keys(ROOMS)); } while (prevSec && order[['a','b','c','d','e'].indexOf(prevSec)] === 'security');
  const roomAt = {}, slotOf = {};
  ['a', 'b', 'c', 'd', 'e'].forEach((s, i) => { roomAt[s] = order[i]; slotOf[order[i]] = s; });
  totalLoops += 1; store.set('ag520.loops', totalLoops);

    loop: S ? S.loop + 1 : 1, t: START, x: 7, y: 11, zone: 'hall', roomAt, slotOf,
    color: pick(Object.keys(COLORS)), content: pick(Object.keys(CONTENTS)),
    guardStage: 0, janitorTold: false, janitorAsked: false,

function tileClass(x, y) {

  if (SLOTS[ch]) return 't ' + S.roomAt[ch];
  if (y === H - 1) return 't entry';
  return 't hall';
}
function renderStatic() {
  const tiles = $('tiles'); tiles.innerHTML = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = document.createElement('div'); d.className = tileClass(x, y); tiles.appendChild(d);
  }
  const labels = $('labels'); labels.innerHTML = '';
  for (const s in SLOTS) {
    const [bx, by, bw, bh] = SLOTS[s].box;
    const el = document.createElement('div'); el.className = 'label';
    Object.assign(el.style, { left: bx / W * 100 + '%', top: by / H * 100 + '%', width: bw / W * 100 + '%', height: bh / H * 100 + '%' });
    el.innerHTML = `<span>${ROOMS[S.roomAt[s]].sign}</span>`;
    labels.appendChild(el);
  }
}
function render() {
  const sp = $('sprites'); sp.innerHTML = '';
  const near = nearNpc();
  const add = (x, y, icon, cls) => {
    const d = document.createElement('div'); d.className = 'sprite ' + (cls || '');
    d.style.left = x / W * 100 + '%'; d.style.top = y / H * 100 + '%'; d.textContent = icon; sp.appendChild(d);
  };
  for (const id in S.npcs) { const [x, y] = S.npcs[id]; add(x, y, NPC_INFO[id].icon, near === id ? 'near' : ''); }

// ---------- world ----------
function npcAt(x, y) { for (const id in S.npcs) { const [nx, ny] = S.npcs[id]; if (nx === x && ny === y) return id; } return null; }
function nearNpc() {
  for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) { const id = npcAt(S.x + dx, S.y + dy); if (id) return id; }
  return null;
}
function zoneAt(x, y) { const ch = MAP[y][x]; return DOOR[ch] || (SLOTS[ch] ? ch : 'hall'); }
function spend(sec) { S.t += sec; render(); if (S.t >= END && !S.done && !S.won) setTimeout(fail, 450); }

function move(dx, dy) {
  if (S.done || !overlayClosed()) return;
  const nx = S.x + dx, ny = S.y + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H || MAP[ny][nx] === '#' || npcAt(nx, ny)) return;
  S.x = nx; S.y = ny;
  const z = zoneAt(nx, ny);
  if (z !== S.zone) { S.zone = z; if (z !== 'hall') enterRoom(z); }
  closePointer();
  spend(COST.move);
  const n = nearNpc();
  if (n && !S.greeted.has(n) && !S.done) { S.greeted.add(n); greet(n); }
}

function enterRoom(slot) {
  const key = S.roomAt[slot], room = ROOMS[key];

// ---------- understanding ----------
function parse(text) {
  const t = ' ' + text.toLowerCase().replace(/[^a-z0-9' ]/g, ' ') + ' ';
  const has = re => re.test(t);
  const out = new Set();
  if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)) out.add('korean');
  if (has(/\b(hi|hello|hey|excuse me|good (afternoon|evening))\b/)) out.add('greet');
  if (has(/\b(lost|lose|losing|missing|cant find|can't find|dropped|forgot)\b/)) out.add('lost');
  if (has(/\b(wallet|purse)\b/)) out.add('wallet');
  if (has(/\bwhere\b/)) out.add('where');
  if (has(/\bhelp\b/)) out.add('help');
  if (has(/\b(security|guard|office|lost and found)\b/)) out.add('security');
  if (has(/\b(thank|thanks|thx)\b/)) out.add('thanks');
  if (has(/\b(yes|yeah|yep|yup|ok|okay)\b/)) out.add('yes');
  if (has(/^\s*(no|nope)\b/)) out.add('no');
  if (has(/\b(coffee|latte|americano|tea|espresso|cappuccino)\b/)) out.add('coffee');
  for (const c of ['black', 'brown', 'red', 'blue', 'white', 'green', 'yellow', 'pink', 'purple', 'gray', 'grey', 'orange']) if (has(new RegExp('\\b' + c + '\\b'))) out.add('k:' + c);
  if (has(/\b(card|id|student)\b/)) out.add('c:card');
  if (has(/\b(photo|picture|pic|photograph)\b/)) out.add('c:photo');
  if (has(/\b(ticket|concert)\b/)) out.add('c:ticket');
  if (has(/\b(money|cash|dollar|dollars|won)\b/)) out.add('c:money');
  for (const w in GLOSSARY) if (has(new RegExp('\\b' + w + '\\b'))) out.add('g:' + w);
  return out;
}
const colorsIn = I => [...I].filter(i => i.startsWith('k:')).map(i => i.slice(2));
const contentsIn = I => [...I].filter(i => i.startsWith('c:')).map(i => i.slice(2));

      return ["Sorry, I mean what's inside the wallet?", '아니, 지갑 안에 뭐가 들었냐고요.', false];
    }
    miss('무관', `"${raw}"`, '경비원은 "What\'s inside it?"(안에 뭐가 들었어요?)라고 물었어요. 학생증(card), 사진(photo), 표(ticket) 같은 걸 말해야 했어요.', ['inside']);
    return ["I need to be sure it's yours. What's inside it?", '당신 건지 확실히 해야 해요. 안에 뭐가 들었어요?', false];
  },
  janitor(I, raw) {
    const sec = SLOTS[S.slotOf.security];
    if (I.has('korean')) { miss('한국어', `"${raw}"`, '청소부는 한국어를 못 알아들어요.'); return ["Sorry, honey, I don't understand.", '미안, 못 알아듣겠어.', false]; }
    if (I.has('confused')) {
      if (S.janitorTold) return [`(She points ${sec.point}.) Wallet... security office. That way!`, `(${sec.dirKo}을 가리키며) 지갑… 경비실. 저쪽!`, true];
      return ['(She pats her own pockets.) You... lost... something?', '(자기 주머니를 두드리며) 너… 뭐… 잃어버렸어?', true];
    }
    if (I.has('wallet') || I.has('lost') || I.has('where') || I.has('help') || I.has('security') || (I.has('yes') && S.janitorAsked)) {
      S.janitorTold = true;
      return [`Oh! Someone found a wallet this morning. They took it to the security office. It's ${sec.dir}.`, `아! 오늘 아침에 누가 지갑을 주웠어. 경비실에 맡겼대. ${sec.dirKo}에 있어.`, true];
    }
    if (I.has('coffee')) return [`Coffee? The Daily Grind is ${SLOTS[S.slotOf.cafe].dir}.`, `커피? 데일리 그라인드는 ${SLOTS[S.slotOf.cafe].dirKo}에 있어.`, true];
    if (I.has('greet') || I.has('thanks')) return [I.has('thanks') ? "You're welcome, sweetie!" : 'Hi! Do you need something?', I.has('thanks') ? '천만에!' : '안녕! 뭐 필요해?', true];
    return ["Sorry, honey, I didn't catch that.", '미안, 잘 못 들었어.', false];
  },
  grandma(I, raw) {
    if (I.has('korean')) return ["Oh, I'm sorry, dear. I don't speak Korean. Try one English word, slowly!", '어머, 미안하구나. 난 한국어를 못 해. 영어 단어 하나를 천천히 말해보렴!', false];
    const g = [...I].find(i => i.startsWith('g:'));
    if (g) { const w = g.slice(2); const en = GLOSSARY[w]; scanKnown(w); return [en, '(할머니가 쉬운 영어로 설명해준다)', true]; }
    if (I.has('lost') || I.has('wallet')) return ['Oh dear! When people find lost things here, they take them to the guard. Look for the door that says SECURITY OFFICE.', '어머나! 여기선 누가 물건을 주우면 경비원한테 맡긴단다. SECURITY OFFICE라고 적힌 문을 찾아보렴.', true];
    if (I.has('confused')) return ["Just say one word you don't know, dear. Like... 'office'?", "모르는 단어 하나만 말해보렴. 예를 들면… 'office'?", true];
    if (I.has('thanks')) return ["Anytime, sweetie. Good luck!", '언제든지, 얘야. 행운을 빈다!', true];
    if (I.has('greet')) return ["Hello again! Take your time, dear.", '또 왔구나! 천천히 하렴.', true];
    return ["Hmm? Tell me just one word you don't know, dear.", '응? 모르는 단어 하나만 말해주렴.', false];
  },
  barista(I, raw) {
    if (I.has('korean')) return ["Sorry—what? I don't speak... that. What can I get you?", '네? 그 말은… 못 해요. 뭐 드릴까요?', false];
    if (I.has('wallet') || I.has('lost')) {
      return [`Oh no! Lost-and-found stuff goes to the security office, I think. It's ${SLOTS[S.slotOf.security].dir}. Sure you don't want a latte first?`, `어머! 분실물은 경비실로 가는 것 같아요. ${SLOTS[S.slotOf.security].dirKo}에 있어요. 라테 먼저 안 드실래요?`, true];
    }
    if (I.has('coffee') || I.has('yes')) {
      S.t += COST.coffee;
      miss('무관', '커피를 주문함', '목표와 상관없이 커피를 샀어요. 맛은 있었지만 3분이 흘렀어요. 카페 직원은 늘 뭔가를 팔려고 해요!');
      return ['One pumpkin spice latte, coming right up! ... Here you go! Have a great one!', '호박 스파이스 라테 하나 바로 나갑니다! … 여기요! 좋은 하루 되세요!', true];
    }
    if (I.has('confused')) return ['Sorry! What. Can. I. Get. You? (She taps the menu.) Coffee?', '죄송해요! 뭐. 드릴. 까요? (메뉴판을 톡톡 치며) 커피?', true];
    if (I.has('greet')) return ["Hi hi! What'll it be?", '안녕하세요! 뭐로 하실래요?', true];
    return ["Sorry, it's super busy right now. What can I get you?", '죄송해요, 지금 너무 바빠서요. 뭐 드릴까요?', false];
  },
};

function act(I, raw, cost, meText, meKind) {
  if (S.done || !overlayClosed()) return;
  const id = nearNpc();
  if (!id) { sys('말을 걸 사람이 없어요. 사람 옆으로 가보세요.'); return; }
  push(meKind, esc(meText));
  const [en, ko, ok] = R[id](I, raw);
  npcSay(id, en, ko);
  if (ok && meKind === 'me') {
    const t = raw.toLowerCase();
    for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) { mark(w, 'seen'); mark(w, 'used'); }
  }
  spend(cost);
}

// ---------- controls ----------
$('sayForm').addEventListener('submit', e => {
  e.preventDefault();
  const raw = $('sayInput').value.trim();
  if (!raw) return;
  $('sayInput').value = '';
  act(parse(raw), raw, COST.say, raw, 'me');
});

const gBox = $('gestures');
for (const g of GESTURES) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
  b.innerHTML = `${esc(g.label)}<small>${g.id === 'confused' ? '1분' : '1분 30초'}</small>`;
  b.addEventListener('click', () => {
    if (g.id === 'point') return openPointer();
    act(new Set(g.intents), '몸짓: ' + g.label, g.id === 'confused' ? COST.confused : COST.gesture, g.act, 'gesture');
  });
  gBox.appendChild(b);
}
const tr = document.createElement('button'); tr.type = 'button'; tr.className = 'chip tool';
tr.innerHTML = '📱 번역기<small>2분 30초</small>';
tr.addEventListener('click', () => {
  if (S.done || !overlayClosed()) return;
  const L = S.lastNpc;
  if (!L || L.translated) { sys(L ? '이미 번역한 말이에요.' : '번역할 말이 아직 없어요.'); return; }
  L.translated = true; scanKnown(L.en);
  const k = document.createElement('span'); k.className = 'ko'; k.textContent = '📱 ' + L.ko; L.el.appendChild(k);
  $('log').scrollTop = $('log').scrollHeight;
  spend(COST.translate);
});
gBox.appendChild(tr);

function openPointer() {
  if (S.done) return;
  const box = $('pointer');
  const zoneKey = S.zone === 'hall' ? 'hall' : S.roomAt[S.zone];
  const objs = OBJECTS[zoneKey] || OBJECTS.hall;
  box.innerHTML = '<p>무엇을 가리킬까요? (1분 30초)</p>';
  for (const o of objs) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = `${o.icon} ${o.ko}`;
    b.addEventListener('click', () => {
      closePointer();
      const I = new Set(['k:' + o.color, 'pointed']); I.pointedEn = o.en;
      act(I, `몸짓: ${o.ko} 가리키기`, COST.gesture, `(${o.ko}을(를) 가리킨다)`, 'gesture');
    });
    box.appendChild(b);
  }
  const x = document.createElement('button'); x.type = 'button'; x.className = 'chip'; x.textContent = '취소';
  x.addEventListener('click', closePointer); box.appendChild(x);
  box.hidden = false;
}
function closePointer() { $('pointer').hidden = true; }

document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => {
  const [dx, dy] = b.dataset.dir.split(',').map(Number); move(dx, dy);
}));
document.addEventListener('keydown', e => {
  if (e.target === $('sayInput')) return;
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (k) { e.preventDefault(); move(k[0], k[1]); }
});

// ---------- overlays ----------
const overlayClosed = () => $('overlay').hidden;
function show(html, onReady) { $('sheet').innerHTML = html; $('overlay').hidden = false; onReady && onReady(); }
function hide() { $('overlay').hidden = true; }

function intro() {
  show(`
    <h2>다시, 5시 20분</h2>
    <p>길을 걷던 중 문득 지갑이 없다는 걸 깨달았다. 방금 전까지 머물던 건물로 돌아왔지만, 누군가 분실물인 줄 알고 경비실에 맡겨둔 것 같다.</p>
    <p><b>목표: 경비실로 가서 지갑을 무사히 되찾기.</b> 경비실은 오후 6시에 닫는다.</p>
    <ul class="how">
      <li>이 건물의 간판과 사람들의 말은 전부 <b>영어</b>예요. 한국어는 통하지 않아요.</li>
      <li>문법은 신경 쓰지 마세요. <b>통하면 장땡</b>이에요.</li>
      <li>말이 안 나오면 <b>몸짓</b>을, 정 모르겠으면 <b>번역기</b>를 쓰세요. 대신 시간이 더 들어요.</li>
      <li>옆집 할머니(👵)에게 모르는 단어를 말하면 쉬운 영어로 설명해줘요.</li>
      <li>6시가 되면 <b>주마등</b>이 스치고, 같은 오후 5시 20분으로 돌아가요. 매번 배치가 조금씩 달라져요.</li>
    </ul>
    <button class="primary" id="go" type="button">오후 5시 20분으로</button>`, () => $('go').addEventListener('click', () => { hide(); $('sayInput').focus(); }));
}

function fail() {
  if (S.done || S.won) return; S.done = true;
  const items = S.mistakes.slice();
  if (S.guardStage === 0 && !S.mistakes.some(m => m.words.includes('security office'))) {
    items.push({ cat: '무관', act: '경비실에 도착하지 못함', explain: '경비실은 간판에 SECURITY OFFICE라고 적혀 있어요. security는 보안·경비, office는 사무실이에요. 모르면 청소부(🧹)에게 물어보거나 할머니(👵)에게 단어를 물어보세요.', at: '6:00 PM', words: ['security office', 'security', 'office'] });
  }
  if (S.guardStage === 1 && !items.some(m => m.words.includes('color'))) {
    items.push({ cat: '무관', act: '경비원의 질문에 답하지 못함', explain: '"What does it look like? What color is it?"는 "어떻게 생겼어요? 무슨 색이에요?"예요. 같은 색 물건을 가리키기만 해도 통했어요.', at: '6:00 PM', words: ['color', 'look like'] });
  }
  if (S.guardStage === 2 && !items.some(m => m.words.includes('inside'))) {
    items.push({ cat: '무관', act: '안에 든 것을 말하지 못함', explain: `"What's inside it?"는 "안에 뭐가 들었어요?"예요. ${CONTENTS[S.content].ko}은 ${CONTENTS[S.content].en}이고, 시늉으로도 보여줄 수 있었어요.`, at: '6:00 PM', words: ['inside'] });
  }
  items.forEach(m => m.words.forEach(w => { mark(w, 'seen'); mark(w, 'known'); }));
  const list = items.map(m => `<li><span class="tag ${m.cat.split(' ')[0]}">${m.cat}</span><span class="act">${m.at} · ${esc(m.act)}</span><span>${esc(m.explain)}</span></li>`).join('');
  show(`
    <h2>6:00 PM. 경비실 불이 꺼졌다.</h2>
    <p class="lead">…눈앞에 오늘 오후가 주마등처럼 스친다.</p>
    <ul class="miss">${list || '<li>이번 판에는 기록된 실수가 없어요. 조금만 더 빨랐으면!</li>'}</ul>
    <p class="lead">주마등에서 뜻을 알게 된 단어는 도감에 💡로 기록돼요. 다음 회차에서는 방 배치와 지갑 생김새가 바뀌어요.</p>
    <button class="primary" id="again" type="button">다시, 5시 20분</button>`, () => $('again').addEventListener('click', () => { hide(); newLoop(); }));
}

function win() {
  if (S.done) return; S.done = true;
  const used = Math.round((S.t - START) / 60);
  const phr = S.phrases.map(([said, model]) => `<li>"${esc(said)}" <span class="arrow">→ 더 자연스럽게</span> <em>${esc(model)}</em></li>`).join('');
  show(`
    <h2>지갑을 되찾았다!</h2>
    <p class="lead">${S.loop}회차 · ${used}분 사용 · 실수 ${S.mistakes.length}번</p>
    <p>당신의 말은 통했어요. 다음엔 이렇게 말해보세요.</p>
    <ul class="phr">${phr || '<li>몸짓만으로 해냈어요! 다음엔 한 단어라도 영어로 말해보세요.</li>'}</ul>
    <button class="primary" id="again" type="button">새로운 오후 시작</button>`, () => $('again').addEventListener('click', () => { hide(); S = null; newLoop(); }));
}

function showJournal() {
  const st = w => { const j = journal[w] || {}; return j.used ? '✋' : j.known ? '💡' : j.seen ? '👀' : ''; };
  const cells = VOCAB.filter(([w]) => journal[w] && journal[w].seen).map(([w, ko]) => {
    const j = journal[w];
    return `<div><span class="st">${st(w)}</span><b>${esc(w)}</b><span class="mean">${j.known || j.used ? esc(ko) : '뜻: ???'}</span></div>`;
  }).join('');
  const n = VOCAB.filter(([w]) => journal[w] && journal[w].seen).length;
  show(`
    <h2>단어 도감</h2>
    <p class="lead">지금까지 ${n}개의 단어를 만났어요 · 누적 ${totalLoops}회차</p>
    <p class="legend">👀 본 적 있음 · 💡 뜻을 알게 됨 (번역기, 할머니, 주마등) · ✋ 직접 써서 통함</p>
    <div class="vocab">${cells || '<p>아직 만난 단어가 없어요. 건물 안을 돌아다녀 보세요.</p>'}</div>
    <button class="primary" id="close" type="button">닫기</button>`, () => $('close').addEventListener('click', hide));
}
$('journalBtn').addEventListener('click', () => { if (overlayClosed()) showJournal(); });
$('overlay').addEventListener('keydown', e => { if (e.key === 'Escape' && $('close')) hide(); });

newLoop();
intro();
})();
</script>
