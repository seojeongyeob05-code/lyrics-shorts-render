<title>다시, 5시 20분</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a pixel-art floor plan beside a framed dialogue column. One deliberate dusk palette (single theme). */
:root {
  color-scheme: dark;
  --bg: #141824;
  --bg-2: #1b2030;
  --panel: #242a3d;
  --panel-2: #2e3550;
  --frame: #e9dcbf;
  --frame-dark: #0b0d14;
  --ink: #f3ead8;
  --muted: #a8a2b6;
  --line: #3b4260;
  --amber: #f2b84b;
  --amber-ink: #2a1a08;
  --sign: #2f8a63;
  --sign-ink: #eefbf2;
  --danger: #e66a55;
  --ok: #86d68f;
  --me: #33416a;
  --dusk: #0a0d2b;
  --f-pixel: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-pixel-b: 'Galmuri11 Bold', 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-pixel); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: none; font-smooth: never;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
b, strong { font-family: var(--f-pixel-b); font-weight: normal; }

/* Pixel frame: dark outline, light rule, dark inner rule. No rounded corners anywhere. */
.px { border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark), inset 0 0 0 2px var(--frame-dark); }
.pxbtn { border: 2px solid var(--frame-dark); background: var(--panel-2); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.08); padding: 4px 12px; }
.pxbtn:hover { background: #3a4366; }
.pxbtn:active { box-shadow: inset 0 3px 0 rgba(0,0,0,.35); transform: translateY(1px); }

.app { max-width: 1160px; margin: 0 auto; display: grid; gap: 18px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--f-pixel-b); font-weight: normal; font-size: 36px; line-height: 1; margin: 0; color: var(--amber); text-shadow: 3px 3px 0 var(--frame-dark); letter-spacing: 0.02em; text-wrap: balance; }
.brand p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock { font-family: var(--f-pixel-b); font-size: 24px; font-variant-numeric: tabular-nums; padding: 2px 12px; background: var(--frame-dark); color: var(--amber); border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark); }
.clock.late { color: var(--frame-dark); background: var(--danger); }
.loop { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.ghost { border: 2px solid var(--frame-dark); background: var(--panel-2); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.08); padding: 4px 12px; font-size: 12px; }
.ghost:hover { background: #3a4366; }

.goal { background: var(--panel); padding: 12px 16px; display: grid; gap: 4px; border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark), inset 0 0 0 2px var(--frame-dark); }
.goal strong { color: var(--amber); font-size: 16px; }
.goal .meta { color: var(--muted); font-size: 12px; }
.goal .wallet b { color: var(--ink); }

main.play { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 880px) { main.play { grid-template-columns: minmax(0, 1fr); } }

/* --- map --- */
.mapwrap { display: grid; gap: 12px; min-width: 0; }
.map { position: relative; width: 100%; max-width: 100%; aspect-ratio: 15 / 12; container-type: inline-size; background: var(--frame-dark); user-select: none; border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark), 0 6px 0 2px rgba(0,0,0,.35); }
.map canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.label { position: absolute; display: grid; place-items: start center; padding-top: 0.9cqw; pointer-events: none; }
.label span { font-family: var(--f-pixel-b); font-size: 1.75cqw; line-height: 1.15; letter-spacing: 0.04em; text-align: center; background: var(--sign); color: var(--sign-ink); padding: 0.35cqw 0.8cqw; border: 0.35cqw solid #d9efe3; box-shadow: 0 0 0 0.3cqw #0d2a1e, 0 0.6cqw 0 0.3cqw rgba(0,0,0,.35); max-width: 96%; white-space: pre-line; }
.label.far span { background: #24493a; color: #7fa596; border-color: #4f7465; letter-spacing: 0.25em; }
.dusk { position: absolute; inset: 0; background: var(--dusk); opacity: 0; pointer-events: none; transition: opacity 0.6s; mix-blend-mode: multiply; }
@media (prefers-reduced-motion: reduce) { .dusk { transition: none; } }

.pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 44px); gap: 6px; justify-content: center; }
.pad button { border: 2px solid var(--frame-dark); background: var(--panel-2); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.08); font-size: 18px; }
.pad button:active { box-shadow: inset 0 3px 0 rgba(0,0,0,.35); transform: translateY(1px); }
.pad .up { grid-column: 2; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
.hint { color: var(--muted); font-size: 12px; text-align: center; margin: 0; }

/* --- dialogue --- */
.talk { background: var(--panel); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; height: min(660px, 80vh); border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark), inset 0 0 0 2px var(--frame-dark); }
@media (max-width: 880px) { .talk { height: 560px; } }
.talk .who { padding: 10px 14px; border-bottom: 2px solid var(--frame-dark); background: var(--bg-2); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 8px; }
.talk .who b { color: var(--ink); }
.swap { border: 2px solid var(--amber); background: var(--bg); padding: 0 8px; font-size: 12px; margin-left: 4px; }
.swap:hover { background: #3a3220; }
.log { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.08) 3px 4px); }
.msg { max-width: 94%; overflow-wrap: anywhere; }
.msg .name { display: inline-block; font-family: var(--f-pixel-b); font-size: 12px; letter-spacing: 0.04em; }
.msg.npc { align-self: flex-start; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 10px; align-items: end; }
.msg.npc .face { width: 52px; height: 52px; background: var(--bg-2); border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark); image-rendering: pixelated; grid-row: 1 / span 2; align-self: end; }
.msg.npc .name { justify-self: start; background: var(--frame-dark); color: var(--amber); padding: 1px 8px; border: 2px solid var(--frame); border-bottom: 0; }
.msg.npc .bubble { background: #3a2433; padding: 9px 12px 10px; border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark), inset 0 0 0 2px var(--frame-dark); position: relative; }
.msg.npc .en { font-size: 16px; }
.msg.npc .next { position: absolute; right: 8px; bottom: 2px; color: var(--amber); font-size: 12px; animation: blink 0.9s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .msg.npc .next { animation: none; } }
.msg.me { align-self: flex-end; background: var(--me); padding: 7px 12px; border: 2px solid #8fa2d8; box-shadow: 0 0 0 2px var(--frame-dark); }
.msg.gesture { align-self: flex-end; color: var(--muted); font-size: 12px; padding: 4px 10px; border: 2px dashed var(--line); }
.msg.place { align-self: stretch; max-width: 100%; background: var(--sign); color: var(--sign-ink); font-family: var(--f-pixel-b); padding: 8px 12px; border: 2px solid #d9efe3; box-shadow: 0 0 0 2px #0d2a1e; letter-spacing: 0.03em; }
.msg.place .name { display: block; font-size: 12px; opacity: 0.75; font-family: var(--f-pixel); }
.msg.sys { align-self: center; max-width: 100%; font-size: 12px; color: var(--muted); text-align: center; padding: 2px 6px; }
.msg .ko { display: block; margin-top: 6px; padding-top: 6px; border-top: 2px dotted rgba(233,220,191,.3); color: #d8c9a8; font-size: 12px; }

.controls { border-top: 2px solid var(--frame-dark); background: var(--bg-2); padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.say { display: flex; gap: 8px; }
.say input { flex: 1; min-width: 0; padding: 9px 11px; background: var(--frame-dark); color: var(--ink); border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark); }
.say input::placeholder { color: #6f6a80; }
.say button { padding: 0 16px; background: var(--amber); color: var(--amber-ink); border: 2px solid var(--frame-dark); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.3); font-family: var(--f-pixel-b); }
.say button:active { box-shadow: inset 0 3px 0 rgba(0,0,0,.25); transform: translateY(1px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--frame-dark); background: var(--panel-2); box-shadow: inset 0 -3px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.07); padding: 3px 9px 5px; font-size: 12px; white-space: nowrap; }
.chip:hover { background: #3a4366; }
.chip:active { box-shadow: inset 0 3px 0 rgba(0,0,0,.3); transform: translateY(1px); }
.chip.tool { background: #4a3a1c; border-color: var(--frame-dark); color: var(--amber); }
.chip small { color: var(--muted); margin-left: 4px; font-size: 12px; }
.pointer { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 2px dashed var(--amber); }
.pointer p { margin: 0; width: 100%; font-size: 12px; color: var(--muted); }

/* --- overlays --- */
.overlay { position: fixed; inset: 0; background: rgba(6, 8, 24, 0.78); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20; }
.sheet { background: var(--panel); color: var(--ink); width: min(640px, 100%); max-height: 88vh; overflow-y: auto; padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; border: 2px solid var(--frame); box-shadow: 0 0 0 2px var(--frame-dark), inset 0 0 0 2px var(--frame-dark), 0 10px 0 2px rgba(0,0,0,.4); }
.sheet h2 { font-family: var(--f-pixel-b); font-weight: normal; font-size: 24px; margin: 0; line-height: 1.25; color: var(--amber); text-shadow: 2px 2px 0 var(--frame-dark); text-wrap: balance; }
.sheet p { margin: 0; }
.sheet .lead { color: var(--muted); font-size: 12px; }
.primary { border: 2px solid var(--frame-dark); background: var(--amber); color: var(--amber-ink); font-family: var(--f-pixel-b); padding: 8px 16px; justify-self: start; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.3); }
.miss { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.miss li { background: var(--bg-2); border: 2px solid var(--line); padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.tag { font-family: var(--f-pixel-b); font-size: 12px; padding: 0 7px; justify-self: start; border: 2px solid currentColor; }
.tag.무관 { color: var(--muted); }
.tag.정반대 { color: var(--danger); }
.tag.거의 { color: var(--ok); }
.tag.놓친 { color: #6fd0a8; }
.tag.한국어 { color: var(--amber); }
.miss .act { font-size: 12px; color: var(--muted); }
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vocab div { background: var(--bg-2); border: 2px solid var(--line); padding: 6px 9px; font-size: 14px; }
.vocab b { letter-spacing: 0.02em; }
.vocab .st { float: right; }
.vocab .mean { display: block; color: var(--muted); font-size: 12px; }
.legend { font-size: 12px; color: var(--muted); }
.phr { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.phr li { font-size: 14px; }
.phr .arrow { color: var(--muted); }
.phr em { font-style: normal; color: var(--ok); }
.levels { display: grid; gap: 10px; }
.lvl { text-align: left; background: var(--bg-2); padding: 10px 12px; display: grid; gap: 2px; border: 2px solid var(--line); box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); }
.lvl:hover { border-color: var(--amber); }
.lvl span { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.lvl b { font-size: 18px; color: var(--amber); }
.lvl small { color: var(--muted); font-size: 12px; }
.lvl .stars { font-style: normal; color: var(--amber); letter-spacing: 0.1em; }
.lvl .skills { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
.lvl .skills em { font-style: normal; font-size: 12px; color: var(--ink); border: 2px solid var(--line); padding: 0 6px; }
.lvl .rec { color: var(--muted); }
.lvl .rec.done { color: var(--ok); }
.newbest { color: var(--amber); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sheet .ghost { justify-self: start; }
.quizword { font-family: var(--f-pixel-b); font-size: 36px; color: var(--ink); text-align: center; padding: 8px 0; text-shadow: 3px 3px 0 var(--frame-dark); overflow-wrap: anywhere; }
.lvl.right { border-color: var(--ok); }
.lvl.right b { color: var(--ok); }
.lvl.wrong { border-color: var(--danger); }
.lvl.wrong b { color: var(--danger); }
.say input.right { border-color: var(--ok); }
.say input.wrong { border-color: var(--danger); }
.rules { border: 2px solid var(--line); background: var(--bg-2); padding: 8px 12px; }
.rules summary { cursor: pointer; font-family: var(--f-pixel-b); color: var(--amber); font-size: 14px; }
.rules[open] summary { margin-bottom: 8px; }
mark.focus { background: transparent; color: var(--amber); border-bottom: 2px dotted var(--amber); }
.msg.place mark.focus { color: #ffe08a; border-color: #ffe08a; }
.goal .focusline { color: var(--ink); }
.how { display: grid; gap: 6px; margin: 0; padding-left: 18px; font-size: 14px; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>다시, 5시 20분</h1>
      <p>영어로만 돌아가는 건물에서 같은 오후를 되풀이하며 배우는 게임</p>
    </div>
    <div class="hud">
      <span class="loop" id="loopLabel">1회차</span>
      <span class="clock" id="clock">5:20 PM</span>
      <button class="ghost" id="levelBtn" type="button">상황 선택</button>
      <button class="ghost" id="journalBtn" type="button">단어 도감</button>
    </div>
  </header>

  <section class="goal" aria-live="polite">
    <strong id="goalTitle">목표: 경비실로 가서 지갑을 무사히 되찾기</strong>
    <span class="meta wallet" id="walletDesc">당신의 지갑: <b>갈색</b> · 안에 <b>학생증</b></span>
    <span class="meta focusline" id="focusLine" hidden></span>
    <span class="meta" id="goalMeta">경비실은 오후 6시에 문을 닫습니다. 걷기·말하기·몸짓·번역기 모두 시간이 흘러요.</span>
  </section>

  <main class="play">
    <div class="mapwrap">
      <div class="map" id="map" aria-label="건물 1층 지도">
        <canvas id="mapCanvas" width="240" height="192"></canvas>
        <div id="labels"></div>
        <div class="dusk" id="dusk"></div>
      </div>
      <div class="pad" aria-label="이동">
        <button class="up" type="button" data-dir="0,-1" aria-label="위로">↑</button>
        <button class="left" type="button" data-dir="-1,0" aria-label="왼쪽으로">←</button>
        <button class="down" type="button" data-dir="0,1" aria-label="아래로">↓</button>
        <button class="right" type="button" data-dir="1,0" aria-label="오른쪽으로">→</button>
      </div>
      <p class="hint">방향키 또는 WASD로 이동 (한 칸에 30초). 사람 옆에 서면 말을 걸 수 있어요.</p>
    </div>

    <section class="talk">
      <div class="who"><span>대화 상대: <b id="whoName">없음</b> <span id="whoSwap"></span></span><span id="whereName">로비</span></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="controls">
        <form class="say" id="sayForm" autocomplete="off">
          <input id="sayInput" type="text" placeholder="영어로 말해보세요 (문법은 신경 쓰지 마세요)" aria-label="할 말">
          <button type="submit">말하기</button>
        </form>
        <div class="chips" id="gestures"></div>
        <div class="pointer" id="pointer" hidden></div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];

// Reads "13", "thirteen", "thirty one" or "four seven two nine" as a digit string.
function numberIn(text) {
  const t = text.toLowerCase();
  const digits = t.replace(/[^0-9]/g, '');
  if (digits) return digits;
  let out = '', pendingTen = 0;
  for (const w of t.split(/[^a-z]+/).filter(Boolean)) {
    if (w in TENS) { if (pendingTen) out += pendingTen; pendingTen = TENS[w]; continue; }
    const i = w === 'oh' ? 0 : ONES.indexOf(w);
    if (i < 0) continue;
    if (pendingTen && i < 10) { out += pendingTen + i; pendingTen = 0; } else { if (pendingTen) { out += pendingTen; pendingTen = 0; } out += i; }
  }
  if (pendingTen) out += pendingTen;
  return out;
}

// Spaced review: a word whose meaning you learned comes back as a quiz after 1, 2, 4, 7, then 14 days.
const DAY = 86400000, REVIEW_DAYS = [1, 2, 4, 7, 14];
function mark(word, field) {
  const j = journal[word] || (journal[word] = {});
  if (!j[field]) {
    j[field] = true;
    if (field === 'known' && j.box == null) { j.box = 0; j.due = Date.now() + DAY * REVIEW_DAYS[0] - 3600000; }
    store.set('ag520.journal', journal);
  }
}
// Words learned before reviews existed are due right away.
for (const w in journal) if ((journal[w].known || journal[w].used) && journal[w].box == null) { journal[w].box = 0; journal[w].due = Date.now(); }
const dueWords = () => VOCAB.filter(([w]) => journal[w] && journal[w].due && journal[w].due <= Date.now()).slice(0, 3);
function grade(w, ok) {
  const j = journal[w];
  j.box = ok ? Math.min(j.box + 1, REVIEW_DAYS.length - 1) : 0;
  j.due = Date.now() + DAY * REVIEW_DAYS[j.box] - 3600000;
  if (ok) delete j.missed; else j.missed = Date.now();
  store.set('ag520.journal', journal);
}
// Words missed in review stay in focus for three days: marked when they show up, and using one counts as a review.
const focusWords = () => VOCAB.map(([w]) => w).filter(w => journal[w] && journal[w].missed && Date.now() - journal[w].missed < 3 * DAY);
function highlight(text) {
  let html = esc(text);
  for (const w of focusWords()) html = html.replace(new RegExp('\\b(' + w + ')\\b', 'gi'), '<mark class="focus" title="다시 볼 단어">$1</mark>');
  return html;
}
function showFocus() {
  const f = focusWords();
  $('focusLine').hidden = !f.length;
  $('focusLine').innerHTML = f.length ? `다시 볼 단어: ${f.map(w => `<mark class="focus">${esc(w)}</mark>`).join(' ')} · 대사에서 찾거나 직접 써보세요.` : '';
}
function scanSeen(text) {
  const t = text.toLowerCase();
  for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) mark(w, 'seen');
}
function scanKnown(text) {
  const t = text.toLowerCase();
  for (const [w] of VOCAB) if (new RegExp('\\b' + w + '\\b').test(t)) { mark(w, 'seen'); mark(w, 'known'); }
}

function move(dx, dy) {
  if (S.done || !overlayClosed()) return;
  const nx = S.x + dx, ny = S.y + dy;
  if (dx) S.facing = dx;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H || MAP[ny][nx] === '#' || npcAt(nx, ny) || blocked(nx, ny)) { drawMap(); return; }
  S.x = nx; S.y = ny;
  const z = zoneAt(nx, ny);
  readSigns();
  if (z !== S.zone) { S.zone = z; if (z !== 'hall') enterRoom(z); }
  closePointer();
  spend(COST.move);
  const n = nearNpc();
  if (n && !S.greeted.has(n) && !S.done) { S.greeted.add(n); greet(n); if (n === 'grandma') return; }
  const g = S.npcs.grandma;
  if (S.level === 2 && S.carrying && !S.done && g && Math.abs(g[0] - S.x) + Math.abs(g[1] - S.y) === 1) { const [en, ko] = R.grandma2(new Set(), ''); npcSay('grandma', en, ko); }
}

  } else {

function parse(text) {
  const t = ' ' + text.toLowerCase().replace(/[^a-z0-9' ]/g, ' ') + ' ';
  const has = re => re.test(t);
  const out = new Set();
  if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)) out.add('korean');
  if (has(/\b(hi|hello|hey|excuse me|good (afternoon|evening))\b/)) out.add('greet');
  if (has(/\b(lost|lose|losing|missing|cant find|can't find|dropped|forgot)\b/)) out.add('lost');
  if (has(/\b(wallet|purse)\b/)) out.add('wallet');
  if (has(/\bwhere\b/)) out.add('where');
  if (has(/\bhelp\b/)) out.add('help');
  if (has(/\b(security|guard|office|lost and found)\b/)) out.add('security');
  if (has(/\b(mail|package|parcel|locker|delivery|box)\b/)) out.add('mail');
  if (has(/\b(thank|thanks|thx)\b/)) out.add('thanks');
  if (has(/\b(yes|yeah|yep|yup|ok|okay)\b/)) out.add('yes');
  if (has(/^\s*(no|nope)\b/)) out.add('no');
  if (has(/\b(coffee|latte|americano|tea|espresso|cappuccino)\b/)) out.add('coffee');
  for (const c of ['black', 'brown', 'red', 'blue', 'white', 'green', 'yellow', 'pink', 'purple', 'gray', 'grey', 'orange']) if (has(new RegExp('\\b' + c + '\\b'))) out.add('k:' + c);
  if (has(/\b(card|id|student)\b/)) out.add('c:card');
  if (has(/\b(photo|picture|pic|photograph)\b/)) out.add('c:photo');
  if (has(/\b(ticket|concert)\b/)) out.add('c:ticket');
  if (has(/\b(sign|signature|sure|write|pen)\b/) || /^\s*[A-Z][a-z]+( [A-Z][a-z]+)?\s*$/.test(text)) out.add('sign');
  if (has(/\b(money|cash|dollar|dollars|won)\b/)) out.add('c:money');
  if (has(/\blatte\b/)) out.add('d:latte');
  if (has(/\b(hot chocolate|chocolate|cocoa)\b/)) out.add('d:hot chocolate');
  if (has(/\b(chai|tea)\b/)) out.add('d:chai tea');
  if (has(/\b(americano|cappuccino|espresso)\b/)) out.add('d:' + t.match(/\b(americano|cappuccino|espresso)\b/)[1]);
  for (const z of ['small', 'medium', 'large']) if (has(new RegExp('\\b' + z + '\\b'))) out.add('s:' + z);
  if (has(/\boat\b/)) out.add('m:oat');
  if (has(/\balmond\b/)) out.add('m:almond');
  if (has(/\b(regular|whole|normal|plain) ?(milk)?\b/)) out.add('m:regular');
  if (has(/\b(to go|take ?out|takeaway|take away|carry out)\b/)) out.add('h:togo');
  else if (has(/\b(for )?here\b/)) out.add('h:here');
  for (const w in GLOSSARY) if (has(new RegExp('\\b' + w + '\\b'))) out.add('g:' + w);
  return out;
}
const colorsIn = I => [...I].filter(i => i.startsWith('k:')).map(i => i.slice(2));
// Grandma explains a word when you say just that word or ask what it means;

const asksMeaning = raw => {

};
const glossWord = raw => {

  for (const w in GLOSSARY) { const m = t.search(new RegExp('\\b' + w + '\\b')); if (m >= 0 && m < at) { best = w; at = m; } }

};

}

// Before a new afternoon starts, words from earlier recaps come back: pick the meaning from four.

function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const meanings = ko => ko.split(/,\s*/);
function checkTyped(typed, w, ko) {
  const t = typed.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!t) return null;
  if (t === w) return { ok: true, msg: '맞았어요!' };
  if (w.length >= 5 && editDistance(t, w) === 1) return { ok: true, msg: `거의 맞았어요! 철자는 "${w}"예요.` };
  const syn = VOCAB.find(([v, k]) => v === t && meanings(k).some(m => meanings(ko).includes(m)));
  if (syn) return { ok: true, msg: `"${t}"도 맞아요! 이번에 찾던 단어는 "${w}"예요.` };
  return { ok: false, msg: `정답은 "${w}"예요.` };
}

  const head = `<h2>지난 주마등 복습 ${i + 1}/${words.length}</h2>`;

  if ((journal[w].box || 0) >= 1) {

  }
  if (S.level === 1 && S.guardStage === 3 && !items.some(m => m.words.includes('sign'))) {
    items.push({ cat: '무관', act: '서명하지 못함', explain: '"Please sign here"는 "여기에 서명해 주세요"예요. sure라고 하거나 서명하는 시늉만 해도 지갑을 받을 수 있었어요.', at: clockStr(S.t), words: ['sign'] });
  }
  if (S.level === 1 && S.guardStage === 2 && !items.some(m => m.words.includes('inside'))) {
    items.push({ cat: '무관', act: '안에 든 것을 말하지 못함', explain: `"What's inside it?"는 "안에 뭐가 들었어요?"예요. ${CONTENTS[S.content].ko}은 ${CONTENTS[S.content].en}이고, 시늉으로도 보여줄 수 있었어요.`, at: '6:00 PM', words: ['inside'] });
  }
  if (S.sawPatrol && S.level === 1) {
    items.push({ cat: '놓친 정보', act: '경비원의 순찰 시간', explain: '"Back at 5:45 PM"은 "오후 5시 45분에 돌아옴"이에요. "a quarter to six"(6시 15분 전)도 5시 45분이라는 뜻이에요. 경비원은 매일 5:35부터 5:45까지 순찰을 돌아요. 그 전에 도착하거나, 그 시간에 맞춰 돌아오세요.', at: '6:00 PM', words: ['back', 'quarter', 'patrol', 'rounds'] });
  }
  items.forEach(m => m.words.forEach(w => { mark(w, 'seen'); mark(w, 'known'); }));
  const list = items.map(m => `<li><span class="tag ${m.cat.split(' ')[0]}">${m.cat}</span><span class="act">${m.at} · ${esc(m.act)}</span><span>${esc(m.explain)}</span></li>`).join('');
  show(`
    <h2>${S.failTitle || { 1: '6:00 PM. 경비실 불이 꺼졌다.', 2: '5:50 PM. 할머니가 집으로 들어갔다.', 3: '6:00 PM. 우편물실 문이 잠겼다.' }[S.level]}</h2>
    <p class="lead">…눈앞에 오늘 오후가 주마등처럼 스친다.</p>
    <ul class="miss">${list || '<li>이번 판에는 기록된 실수가 없어요. 조금만 더 빨랐으면!</li>'}</ul>
    <p class="lead">주마등에서 뜻을 알게 된 단어는 도감에 💡로 기록돼요. 다음 회차에서는 방 배치와 ${{ 1: '지갑 생김새', 2: '할머니의 주문', 3: '보관함 번호와 비밀번호' }[S.level]}가 바뀌어요.</p>
    <button class="primary" id="again" type="button">다시, 5시 20분</button>`, () => $('again').addEventListener('click', () => { hide(); newLoop(); }));
}

function win() {
  if (S.done) return; S.done = true;
  if (!cleared.includes(S.level)) { cleared.push(S.level); store.set('ag520.cleared', cleared); }
  const mins = Math.round((S.t - START) / 60), prev = best[S.level];
  const newBest = !prev || S.loop < prev.loops || (S.loop === prev.loops && mins < prev.minutes);
  if (newBest) { best[S.level] = { loops: S.loop, minutes: mins, mistakes: S.mistakes.length }; store.set('ag520.best', best); }
  const used = Math.round((S.t - START) / 60);
  const phr = S.level === 3 && S.bigParcel
    ? `<li><em>too big</em> for the lockers → SECURITY OFFICE · apartment <em>${aptWords(S.apt)}</em> = ${S.apt}호</li>`
    : S.level === 3
    ? `<li>locker <em>${numWord(S.locker)}</em> = ${S.locker}번 · code <em>${[...S.code].map(d => ONES[+d]).join(' ')}</em> = ${S.code}</li>`
    : S.phrases.map(([said, model]) => `<li>"${esc(said)}" <span class="arrow">→ 더 자연스럽게</span> <em>${esc(model)}</em></li>`).join('');
  show(`
    <h2>${{ 1: '지갑을 되찾았다!', 2: '할머니가 활짝 웃었다!', 3: '택배를 찾았다!' }[S.level]}</h2>
    <p class="lead">${S.loop}회차 · ${used}분 사용 · 실수 ${S.mistakes.length}번${newBest ? ' · <b class="newbest">새 최고 기록!</b>' : ''}</p>
    <p>${S.level === 3 ? '쪽지의 숫자를 제대로 읽었어요.' : '당신의 말은 통했어요. 다음엔 이렇게 말해보세요.'}</p>
    <ul class="phr">${phr || '<li>몸짓만으로 해냈어요! 다음엔 한 단어라도 영어로 말해보세요.</li>'}</ul>
    <p><b>다른 상황도 해보세요.</b></p>
    ${levelButtons()}`, bindLevels);
}

function showJournal() {
  const st = w => { const j = journal[w] || {}; return (j.used ? '✋' : j.known ? '💡' : j.seen ? '👀' : '') + (j.box ? ' ' + '★'.repeat(j.box) : ''); };
  const cells = VOCAB.filter(([w]) => journal[w] && journal[w].seen).map(([w, ko]) => {
    const j = journal[w];
    return `<div><span class="st">${st(w)}</span><b>${esc(w)}</b><span class="mean">${j.known || j.used ? esc(ko) : '뜻: ???'}</span></div>`;
  }).join('');
  const n = VOCAB.filter(([w]) => journal[w] && journal[w].seen).length;
  show(`
    <h2>단어 도감</h2>
    <p class="lead">지금까지 ${n}개의 단어를 만났어요 · 누적 ${totalLoops}회차</p>
    <p class="legend">👀 본 적 있음 · 💡 뜻을 알게 됨 (번역기, 할머니, 주마등) · ✋ 직접 써서 통함 · ★ 복습 퀴즈를 맞힌 단계</p>
    <p class="legend">지금 복습할 단어: ${dueWords().length ? dueWords().map(([w]) => esc(w)).join(', ') + ' (상황을 고르면 시작해요)' : '없음'}</p>
    <div class="vocab">${cells || '<p>아직 만난 단어가 없어요. 건물 안을 돌아다녀 보세요.</p>'}</div>
    <button class="primary" id="close" type="button">닫기</button>`, () => $('close').addEventListener('click', hide));
}
$('journalBtn').addEventListener('click', () => { if (overlayClosed()) showJournal(); });
$('overlay').addEventListener('keydown', e => { if (e.key === 'Escape' && $('close')) hide(); });

newLoop();
intro();
})();
</script>
