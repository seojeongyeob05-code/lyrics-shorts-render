<style>
/* Layout (teal = 일반화학, matching the 학습일지): one calm 520px column. Home = "continue" card on top, then each unit as a vertical timeline of lessons. Lesson = full-screen, question on top, action bar pinned to the bottom. */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --sunken: #EEF0F3;
  --ink: #15181D;
  --ink-2: #3A404A;
  --muted: #737B87;
  --line: #E2E5EA;
  --accent: #17716B;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF0EC;
  --ok: #2F7D32;
  --ok-soft: #E7F6EC;
  --bad: #C2341F;
  --bad-soft: #FCEBE7;
  --flame: #EA6A12;
  --radius: 16px;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1114; --surface: #181B20; --sunken: #20242A; --ink: #ECEEF1; --ink-2: #C3C8D0; --muted: #8B93A0;
    --line: #2A2F37; --accent: #5CC3B9; --accent-ink: #062320; --accent-soft: #173A37; --ok: #7CCF80; --ok-soft: #12291C;
    --bad: #FF8A73; --bad-soft: #2E1814; --flame: #FB923C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1114; --surface: #181B20; --sunken: #20242A; --ink: #ECEEF1; --ink-2: #C3C8D0; --muted: #8B93A0;
  --line: #2A2F37; --accent: #5CC3B9; --accent-ink: #062320; --accent-soft: #173A37; --ok: #7CCF80; --ok-soft: #12291C;
  --bad: #FF8A73; --bad-soft: #2E1814; --flame: #FB923C; color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { box-sizing: border-box; width: 100%; max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 14px; }
.brand { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 11px 0 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.pill svg { width: 16px; height: 16px; }
.pill.streak { color: var(--flame); }
.pill.streak.off { color: var(--muted); }
.pill.xp { color: var(--accent); }

/* home */
main.home { padding-block: 4px 64px; display: grid; gap: 28px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 18px; }
.hero-top { display: flex; gap: 16px; align-items: center; }
.hero-txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.hero h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.hero .meta { margin: 0; color: var(--muted); font-size: 14px; }
.ring { flex: none; width: 64px; height: 64px; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--sunken); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring.full .bar { stroke: var(--ok); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.15; color: var(--muted); }
.ring span b { display: block; font-family: var(--f-mono); font-size: 15px; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 14px; font-weight: 600; font-size: 16px; background: var(--accent); color: var(--accent-ink); transition: filter .15s, transform .1s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.985); }
.btn:disabled { background: var(--sunken); color: var(--muted); cursor: default; filter: none; transform: none; }
.btn.wide { width: 100%; }
.btn.ok { background: var(--ok); color: var(--surface); }
.btn.bad { background: var(--bad); color: var(--surface); }
.review { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.review .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.review .ic svg { width: 20px; height: 20px; }
.review .tx { flex: 1; min-width: 0; display: grid; line-height: 1.35; }
.review .tx b { font-weight: 600; }
.review .tx span { font-size: 13px; color: var(--muted); }
.review:disabled { cursor: default; }
.review:disabled .ic { background: var(--sunken); color: var(--muted); }
.chev { flex: none; width: 18px; height: 18px; color: var(--muted); }

.unit { display: grid; gap: 12px; }
.unit-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline: 4px; }
.unit-head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.unit-head span { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.unit-bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; margin-inline: 4px; }
.unit-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.steps { list-style: none; margin: 0; padding: 6px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.steps li { position: relative; }
.steps li + li::before { content: ""; position: absolute; left: 33px; top: -10px; height: 20px; width: 2px; background: var(--line); }
.steps li.was-done + li::before { background: var(--accent); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px 16px; border-radius: 12px; }
.row:hover { background: var(--sunken); }
.disc { position: relative; z-index: 1; flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--muted); background: var(--surface); border: 2px solid var(--line); }
.disc svg { width: 18px; height: 18px; }
.row.done .disc { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row.next .disc { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.row .tx { flex: 1; min-width: 0; display: grid; line-height: 1.35; }
.row .tx b { font-weight: 500; font-size: 15px; color: var(--ink); }
.row .tx span { font-size: 12.5px; color: var(--muted); }
.row.next .tx b { font-weight: 700; }
.row.next .tx span { color: var(--accent); font-weight: 600; }
.sync { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

/* lesson screen */
.lesson { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lesson-top { display: flex; align-items: center; gap: 14px; padding-block: 14px; flex: none; }
.x { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.x:hover { background: var(--sunken); color: var(--ink); }
.x svg { width: 20px; height: 20px; }
.prog { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s; }
.lesson-body { flex: 1; overflow-y: auto; }
.lesson-body .wrap { display: grid; gap: 20px; align-content: start; padding-block: 12px 28px; }
.qtext { font-size: 20px; line-height: 1.55; font-weight: 600; letter-spacing: -0.02em; margin: 0; overflow-x: auto; }
.concept { display: grid; gap: 14px; }
.concept h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.concept ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: c; }
.concept li { counter-increment: c; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 14px 48px; position: relative; overflow-x: auto; color: var(--ink-2); }
.concept li::before { content: counter(c); position: absolute; left: 16px; top: 15px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 12px/22px var(--f-mono); text-align: center; }
.concept strong { color: var(--ink); font-weight: 700; }
.concept a { justify-self: start; color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }
.concept a:hover { text-decoration: underline; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; min-width: 0; transition: border-color .12s, background .12s; }
.opt:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt .t { min-width: 0; overflow-x: auto; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { border-color: var(--bad); background: var(--bad); color: var(--surface); }
.opts.locked .opt { cursor: default; }
.opts.locked .opt:not(.right):not(.wrong) { opacity: .55; }
.answer-in { width: 100%; box-sizing: border-box; font: 500 20px var(--f-mono); padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.answer-in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.hint { font-size: 13px; color: var(--muted); margin-top: -10px; }
.slots { min-height: 56px; border-radius: 14px; border: 1.5px dashed var(--line); padding: 8px; display: grid; gap: 8px; align-content: start; }
.slots:empty { display: grid; place-items: center; }
.slots:empty::before { content: "아래에서 단계를 순서대로 눌러주세요"; color: var(--muted); font-size: 14px; }
.pool { display: grid; gap: 8px; }
.chip { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; display: flex; gap: 12px; align-items: baseline; min-width: 0; font-size: 15px; }
.chip .t { min-width: 0; overflow-x: auto; }
.chip .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 600; flex: none; }
.slots .chip { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.chip.used { visibility: hidden; }

.sheet { flex: none; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); transition: background .15s; }
.sheet .wrap { padding-block: 16px; display: grid; gap: 12px; }
.sheet.ok { background: var(--ok-soft); border-color: transparent; }
.sheet.bad { background: var(--bad-soft); border-color: transparent; }
.verdict { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 700; }
.verdict i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--surface); }
.verdict i svg { width: 16px; height: 16px; }
.sheet.ok .verdict { color: var(--ok); } .sheet.ok .verdict i { background: var(--ok); }
.sheet.bad .verdict { color: var(--bad); } .sheet.bad .verdict i { background: var(--bad); }
.explain { margin: 0; font-size: 15px; color: var(--ink-2); overflow-x: auto; max-height: 34vh; overflow-y: auto; }
.explain b { color: var(--ink); }

.finish { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 48px 8px; }
.finish .badge { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 8px; }
.finish .badge svg { width: 34px; height: 34px; }
.finish h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
.finish p { margin: 0; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tile { padding: 16px 6px; display: grid; gap: 2px; }
.tile + .tile { border-left: 1px solid var(--line); }
.tile b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
.tile span { font-size: 12px; color: var(--muted); }
.tile.xp b { color: var(--accent); }
.tile.acc b { color: var(--ok); }
.tile.st b { color: var(--flame); }
.term { cursor: help; text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, var(--accent) 70%, transparent); text-decoration-thickness: 2px; text-underline-offset: 4px; border-radius: 4px; }
.term:hover { background: var(--accent-soft); }
.gloss { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 20, 0.42); display: flex; align-items: flex-end; justify-content: center; }
.gloss-card { box-sizing: border-box; width: 100%; max-width: 520px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 14px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 6px; animation: rise .2s ease-out; }
.gloss-head { display: flex; align-items: center; justify-content: space-between; }
.gloss-head .x { margin-right: -8px; }
.gloss h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.gloss p { margin: 0; color: var(--ink-2); overflow-x: auto; }
mjx-container { font-size: 106% !important; }
mjx-container[display="true"] { margin: .4em 0 !important; overflow-x: auto; overflow-y: hidden; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes rise { from { transform: translateY(6px); opacity: .4 } to { transform: none; opacity: 1 } }
.rise { animation: rise .2s ease-out; }
</style>

<script type="text/plain" id="course">
## 1 | 기초 | 화학의 기초
c: **유효숫자** 세기: 앞쪽 0은 세지 않고, 사이에 낀 0은 세고, 소수점이 있을 때 뒤쪽 0은 세요. $0.00450$ 은 3개예요.
c: 곱셈·나눗셈은 유효숫자 **개수**가 가장 적은 값에 맞추고, 덧셈·뺄셈은 **소수점 자리**가 가장 적은 값에 맞춰요.
c: 온도 변환: $T(\text{K}) = T(^\circ\text{C}) + 273.15$, $T(^\circ\text{F}) = 1.8\,T(^\circ\text{C}) + 32$. 밀도 $d = m/V$.
Q in
q: $0.004050$ 의 유효숫자는 몇 개일까요?
a: 4
e: 앞의 0 세 개는 자리만 잡아줘요. 4, 0, 5, 0 이 유효숫자예요. 마지막 0은 소수점 뒤에 있으니 세요.
Q mc
q: $12.11 + 18.0 + 1.013$ 을 유효숫자에 맞게 쓰면?
a: $31.1$
w: $31.123$
w: $31.12$
w: $31$
e: 덧셈은 소수점 자리가 가장 적은 $18.0$ (첫째 자리)에 맞춰요. $31.123 \to 31.1$
Q mc
q: $4.56 \times 1.4$ 를 유효숫자에 맞게 쓰면?
a: $6.4$
w: $6.38$

<script type="application/json" id="glossary">[{"t": "유효숫자", "d": "측정값에서 의미 있는 자릿수예요. 확실한 숫자 전부와 마지막 어림 숫자 하나까지 세요."}, {"t": "원자번호", "d": "원자핵 속 양성자 수 $Z$예요. 원소의 종류를 정해요."}, {"t": "질량수", "d": "양성자 수 + 중성자 수 $A$예요. 원자량(평균 질량)과는 달라요."}, {"t": "동위원소", "d": "양성자 수는 같고 중성자 수가 다른 원자예요. 예: ¹²C 와 ¹⁴C"}, {"t": "몰질량", "d": "물질 1 mol 의 질량(g/mol)이에요. 화학식 속 원자량을 모두 더하면 돼요."}, {"t": "실험식", "d": "원자 수를 가장 간단한 정수비로 나타낸 화학식이에요. 포도당 C₆H₁₂O₆ 의 실험식은 CH₂O"}, {"t": "한계 반응물", "d": "반응 중 가장 먼저 다 떨어지는 반응물이에요. 생성물의 최대량(이론 수득량)을 정해요."}, {"t": "수득률", "d": "실제로 얻은 양 ÷ 이론 수득량 × 100 (%)이에요."}, {"t": "몰농도", "d": "용액 1 L 에 녹아 있는 용질의 mol 수(M = mol/L)예요. 온도가 바뀌면 부피가 변해 값도 조금 변해요."}, {"t": "알짜 이온 반응식", "d": "구경꾼 이온을 빼고 실제로 반응에 참여하는 입자만 쓴 반응식이에요."}, {"t": "산화수", "d": "전자를 모두 전기음성도가 큰 쪽에 준다고 가정했을 때 원자가 갖는 가상의 전하예요. 산화되면 증가, 환원되면 감소해요."}, {"t": "분압", "d": "혼합 기체에서 한 성분이 혼자 그 부피를 차지할 때 나타낼 압력이에요. 전체 압력 × 몰분율"}, {"t": "반데르발스", "d": "실제 기체 상태 방정식 $[P + a(n/V)^2](V - nb) = nRT$. $a$ 는 인력, $b$ 는 분자 부피 보정이에요."}, {"t": "엔탈피", "d": "$H = E + PV$. 일정 압력에서 주고받은 열이 엔탈피 변화 $\\Delta H$ 예요."}, {"t": "비열", "d": "물질 1 g 의 온도를 1 °C 올리는 데 필요한 열이에요. 물은 4.18 J/(g·°C)"}, {"t": "헤스 법칙", "d": "엔탈피는 상태함수라서 반응을 여러 단계로 나눠도 $\\Delta H$ 의 합은 같다는 법칙이에요."}, {"t": "양자수", "d": "전자의 상태를 나타내는 네 수 $n, \\ell, m_\\ell, m_s$ 예요. 각각 크기·모양·방향·스핀"}, {"t": "파울리 배타 원리", "d": "한 원자 안의 두 전자는 네 양자수가 모두 같을 수 없어요. 그래서 오비탈 하나에 스핀이 반대인 전자 2개까지만 들어가요."}, {"t": "훈트 규칙", "d": "에너지가 같은 오비탈에는 전자가 짝짓기 전에 스핀을 나란히 하고 하나씩 먼저 들어가요."}, {"t": "이온화 에너지", "d": "기체 상태 원자에서 전자 하나를 떼어내는 데 필요한 에너지예요. 주기율표 오른쪽 위로 갈수록 커요."}, {"t": "전기음성도", "d": "결합한 원자가 공유 전자쌍을 끌어당기는 정도예요. F 가 가장 커요 (4.0)."}, {"t": "형식 전하", "d": "원자가 전자 − 비공유 전자 − ½ × 공유 전자. 0 에 가까운 루이스 구조가 더 그럴듯해요."}, {"t": "VSEPR", "d": "원자가 껍질 전자쌍 반발 이론. 중심 원자 주위 전자 영역들이 서로 최대한 멀어지게 배치된다고 보고 분자 모양을 예측해요."}, {"t": "혼성", "d": "원자 오비탈을 섞어 같은 모양·에너지의 새 오비탈(sp, sp², sp³ 등)을 만드는 것이에요."}, {"t": "결합 차수", "d": "(결합 오비탈 전자 − 반결합 오비탈 전자) ÷ 2. 클수록 결합이 강하고 짧아요. 0 이면 분자가 안정하지 않아요."}, {"t": "상자성", "d": "홀전자가 있어 자기장에 끌리는 성질이에요. 홀전자가 없으면 반자성이에요."}, {"t": "런던 분산력", "d": "순간적으로 생긴 쌍극자가 이웃에 쌍극자를 유도해 생기는 약한 인력이에요. 모든 분자에 있고 분자가 클수록 세져요."}, {"t": "수소 결합", "d": "N, O, F 에 붙은 H 와 이웃 분자의 N, O, F 비공유쌍 사이의 강한 쌍극자 인력이에요."}, {"t": "증기압", "d": "닫힌 용기에서 액체와 평형을 이룬 증기의 압력이에요. 온도가 오르면 커지고 분자간 힘이 크면 작아요."}, {"t": "삼중점", "d": "고체, 액체, 기체 세 상이 함께 평형을 이루는 온도·압력이에요."}, {"t": "몰랄농도", "d": "용매 1 kg 당 용질 mol 수(m)예요. 질량 기준이라 온도와 무관해요."}, {"t": "라울 법칙", "d": "용액 위 용매의 증기압 = 용매 몰분율 × 순수 용매의 증기압"}, {"t": "헨리 법칙", "d": "기체의 용해도는 그 기체의 부분압에 비례한다 ($C = kP$)는 법칙이에요."}, {"t": "총괄성", "d": "용질의 종류와 상관없이 입자 수에만 의존하는 성질이에요. 증기압 내림, 끓는점 오름, 어는점 내림, 삼투압"}, {"t": "반트호프 인자", "d": "용질 1 mol 이 녹아 실제로 만드는 입자 mol 수 $i$ 예요. 이온쌍 때문에 실제 값은 이상값보다 조금 작아요."}, {"t": "삼투압", "d": "반투막을 사이에 두고 용매가 용액 쪽으로 들어오는 것을 막는 데 필요한 압력 $\\pi = iMRT$ 예요."}, {"t": "속도 법칙", "d": "반응 속도를 반응물 농도의 거듭제곱으로 나타낸 식이에요. 차수는 실험으로만 정해져요."}, {"t": "반감기", "d": "반응물 농도가 처음의 절반이 되는 데 걸리는 시간이에요. 1차 반응은 $0.693/k$ 로 일정해요."}, {"t": "촉매", "d": "반응 경로를 바꿔 활성화 에너지를 낮추고, 반응 뒤에 그대로 남는 물질이에요."}, {"t": "활성화 에너지", "d": "반응이 일어나려면 넘어야 하는 에너지 장벽 $E_a$ 예요. 작을수록 반응이 빨라요."}, {"t": "속도 결정 단계", "d": "여러 단계 반응에서 가장 느린 단계예요. 전체 속도 법칙을 결정해요."}, {"t": "르 샤틀리에 원리", "d": "평형 상태에 농도·압력·온도 변화를 주면 그 변화를 줄이는 쪽으로 평형이 이동한다는 원리예요."}, {"t": "짝산", "d": "염기가 H⁺ 하나를 받아서 된 물질이에요. 예: NH₃ → NH₄⁺"}, {"t": "짝염기", "d": "산이 H⁺ 하나를 내주고 남은 물질이에요. 예: CH₃COOH → CH₃COO⁻"}, {"t": "완충 용액", "d": "약산과 짝염기(또는 약염기와 짝산)가 함께 있어 pH 변화를 막아주는 용액이에요."}, {"t": "당량점", "d": "적정에서 넣은 산과 염기의 mol 이 반응식 비율대로 정확히 같아진 점이에요."}, {"t": "지시약", "d": "pH 에 따라 색이 바뀌는 약산이에요. 변색 범위 ≈ 지시약의 p$K_a$ ± 1"}, {"t": "용해도곱", "d": "난용성 염의 용해 평형 상수 $K_{sp}$ 예요. 고체는 식에서 빠지므로 이온 농도의 곱이에요."}, {"t": "공통 이온 효과", "d": "평형에 관여하는 이온이 이미 들어 있으면 평형이 그 이온을 줄이는 쪽으로 이동하는 현상이에요."}, {"t": "착이온", "d": "중심 금속 이온에 리간드가 배위 결합한 이온이에요. 예: Ag(NH₃)₂⁺"}, {"t": "엔트로피", "d": "계가 가질 수 있는 미시 상태 수의 척도 $S$ 예요. 에너지가 얼마나 퍼져 있는지를 나타내요."}, {"t": "자유 에너지", "d": "깁스 자유 에너지 $G = H - TS$. 일정 온도·압력에서 $\\Delta G < 0$ 이면 자발적이에요."}, {"t": "산화전극", "d": "산화가 일어나는 전극(anode)이에요. 갈바니 전지에서는 (−) 극이에요."}, {"t": "환원전극", "d": "환원이 일어나는 전극(cathode)이에요. 갈바니 전지에서는 (+) 극이에요."}, {"t": "염다리", "d": "두 반쪽 전지를 이어 이온이 이동하게 해서 전하 균형을 유지하는 장치예요."}, {"t": "네른스트 식", "d": "표준이 아닌 농도에서 전지 전위를 구하는 식 $E = E^\\circ - \\frac{0.0592}{n}\\log Q$ (25 °C)"}, {"t": "질량 결손", "d": "핵을 이루는 핵자 질량의 합과 실제 핵 질량의 차이예요. 이 질량이 결합 에너지($\\Delta mc^2$)가 돼요."}, {"t": "동소체", "d": "같은 원소로 이루어졌지만 구조가 다른 홑원소 물질이에요. 예: 흑연과 다이아몬드"}, {"t": "리간드", "d": "중심 금속에 비공유 전자쌍을 내주며 결합하는 분자나 이온이에요. 예: NH₃, CN⁻, H₂O"}, {"t": "배위수", "d": "중심 금속에 직접 결합한 리간드 원자의 수예요. 6 이면 보통 팔면체"}, {"t": "킬레이트", "d": "한 리간드가 여러 자리로 금속을 집게처럼 무는 것이에요. 예: en (에틸렌다이아민), EDTA"}, {"t": "결정장", "d": "리간드의 음전하가 d 오비탈 에너지를 갈라놓는다고 보는 모형이에요. 갈라진 폭이 $\\Delta$"}, {"t": "저스핀", "d": "$\\Delta$ 가 짝짓기 에너지보다 커서 전자가 아래 오비탈에서 먼저 짝지은 상태예요. 홀전자가 적어요."}, {"t": "작용기", "d": "분자의 화학적 성질을 결정하는 원자 묶음이에요. 예: –OH, –COOH, –NH₂"}, {"t": "이성질체", "d": "분자식은 같지만 원자 배열이 다른 화합물이에요."}, {"t": "펩타이드 결합", "d": "한 아미노산의 –COOH 와 다른 아미노산의 –NH₂ 가 물을 내놓으며 만든 –CO–NH– 결합이에요."}]</script>
<script>
(function () {
  const DRIVE = {};
  const DAILY_GOAL = 30;
  const BOX_DAYS = [0, 1, 3, 7, 16, 35];
  const LS_KEY = "chem-daily-v1";

  // ---------- course parsing ----------
  function parseCourse(text) {
    const lessons = [];
    let L = null, Q = null;
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith("## ")) {
        const [id, unit, title] = line.slice(3).split(" | ").map(s => s.trim());
        L = { id, unit, title, concept: [], qs: [] };
        lessons.push(L); Q = null; continue;
      }
      if (line.startsWith("Q ")) {
        Q = { type: line.slice(2).trim(), q: "", a: [], w: [], s: [], e: "" };
        Q.id = L.id + "-" + (L.qs.length + 1);
        L.qs.push(Q); continue;
      }
      const m = line.match(/^([cqawse]):\s?(.*)$/);
      if (!m) continue;
      const [, k, v] = m;
      if (k === "c") L.concept.push(v);
      else if (k === "q") Q.q = v;
      else if (k === "e") Q.e = v;
      else if (k === "a") Q.type === "in" ? Q.a.push(...v.split(" ; ").map(s => s.trim())) : Q.a.push(v);
      else Q[k].push(v);
    }
    return lessons;
  }
  const LESSONS = parseCourse(document.getElementById("course").textContent);
  const QMAP = {};
  LESSONS.forEach(l => l.qs.forEach(q => { QMAP[q.id] = Object.assign(q, { lesson: l }); }));

  // ---------- state & persistence ----------
  const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
  const blank = () => ({ xp: 0, streak: 0, lastDay: null, dayXp: 0, dayKey: null, lessons: {}, cards: {}, updatedAt: 0 });
  let S = blank();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

  let remote = null, saveTimer = null, saving = Promise.resolve();
  function persist() {
    S.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
    if (!remote) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(S));
      saving = saving.then(() => remote.set(body)).then(() => setSync("진도가 계정에 저장됐어요"), () => setSync("저장하지 못했어요. 이 브라우저에는 남아 있어요"));
    }, 600);
  }
  function setSync(t) { document.getElementById("sync").textContent = t; }

  async function connect() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc("data/users/" + uid + "/progress");
      const snap = await ref.get();
      if (snap.exists) {
        const r = snap.data();
        if ((r.updatedAt || 0) > (S.updatedAt || 0)) {
          S = Object.assign(blank(), JSON.parse(JSON.stringify(r)));
          try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
          renderHome();
        }
      }
      remote = ref;
      setSync("진도가 계정에 저장돼요. 다른 기기에서도 이어서 할 수 있어요");
      if (!snap.exists && S.updatedAt) persist();
    } catch (e) { /* stay local */ }
  }

  function rollDay() {
    const t = today();
    if (S.dayKey !== t) { S.dayKey = t; S.dayXp = 0; }
  }
  function streakAlive() { return S.lastDay !== null && today() - S.lastDay <= 1; }
  function touchStreak() {
    const t = today();
    if (S.lastDay === t) return;
    S.streak = (S.lastDay === t - 1) ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  function dueCards() {
    const t = today();
    return Object.keys(S.cards).filter(id => QMAP[id] && S.cards[id].d <= t);
  }
  function grade(id, correct) {
    const c = S.cards[id] || { b: 0, d: today() };
    c.b = correct ? Math.min(c.b + 1, BOX_DAYS.length - 1) : 0;
    c.d = today() + BOX_DAYS[c.b];
    S.cards[id] = c;
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const GLOSS = JSON.parse(document.getElementById("glossary").textContent);
  const GIDX = {}; GLOSS.forEach((g, i) => { GIDX[g.t] = i; });
  const TERM_RE = new RegExp("(" + GLOSS.map(g => g.t).sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g");
  let seenTerms = new Set();
  function linkTerms(text) {
    return text.replace(TERM_RE, t => {
      if (seenTerms.has(t)) return t;
      seenTerms.add(t);
      return '<span class="term" role="button" tabindex="0" data-g="' + GIDX[t] + '">' + t + '</span>';
    });
  }
  const md = s => esc(s).split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$)/).map((seg, i) => i % 2 ? seg : linkTerms(seg)).join("").replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>');
  // Answer options and order chips are buttons: a glossary link inside one would swallow the tap, so they get no term links.
  const mdPlain = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>');
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function typeset(el) {
    const run = () => { if (window.MathJax && MathJax.typesetPromise) { try { MathJax.typesetClear && MathJax.typesetClear([el]); } catch (e) {} MathJax.typesetPromise([el]).catch(() => {}); } };
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run); else setTimeout(run, 400);
  }
  function parseNum(s) {
    s = s.replace(/\s+/g, "").replace(/−/g, "-");
    const f = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (f) return parseFloat(f[1]) / parseFloat(f[2]);
    return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
  }
  function checkInput(q, val) {
    const norm = s => s.replace(/\s+/g, "").replace(/−/g, "-").toLowerCase();
    if (q.a.some(a => norm(a) === norm(val))) return true;
    const v = parseNum(val);
    return !isNaN(v) && q.a.some(a => { const n = parseNum(a); if (isNaN(n)) return false; const tol = /\./.test(a) ? Math.abs(n) * 0.01 : 1e-9; return Math.abs(n - v) <= tol + 1e-12; });
  }

  // ---------- home ----------
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>';
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const mins = l => Math.max(2, Math.round(l.qs.length * 0.5 + 1));
  function renderHome() {
    rollDay();
    $("st-xp").textContent = S.xp;
    const alive = streakAlive();
    $("st-streak-n").textContent = alive ? S.streak : 0;
    $("st-streak").classList.toggle("off", !(alive && S.lastDay === today()));
    const frac = Math.min(1, S.dayXp / DAILY_GOAL);
    $("ring-bar").style.strokeDashoffset = (169.6 * (1 - frac)).toFixed(1);
    $("ring").classList.toggle("full", frac >= 1);
    $("ring-n").textContent = S.dayXp;

    const next = LESSONS.find(l => !S.lessons[l.id]);
    const heroL = next || LESSONS[LESSONS.length - 1];
    $("hero-eyebrow").textContent = next ? (Object.keys(S.lessons).length ? "이어서 학습" : "첫 레슨") : "모든 레슨 완료 · 다시 풀기";
    $("hero-title").textContent = heroL.id + "장 " + heroL.title;
    $("hero-meta").textContent = heroL.unit + " · " + heroL.qs.length + "문제 · 약 " + mins(heroL) + "분";
    $("hero-btn").onclick = () => startLesson(heroL);

    const due = dueCards().length;
    $("review-sub").textContent = due ? due + "문제가 기다리고 있어요" : "틀린 문제가 생기면 여기 모여요";
    $("review-btn").disabled = due === 0;

    const units = [];
    LESSONS.forEach(l => { let u = units.find(x => x.name === l.unit); if (!u) units.push(u = { name: l.unit, ls: [] }); u.ls.push(l); });
    const host = $("units");
    host.innerHTML = "";
    units.forEach(u => {
      const done = u.ls.filter(l => S.lessons[l.id]).length;
      const sec = document.createElement("section");
      sec.className = "unit";
      sec.innerHTML = '<div class="unit-head"><h2>' + esc(u.name) + '</h2><span>' + done + '/' + u.ls.length + '</span></div>' +
        '<div class="unit-bar"><i style="width:' + Math.round(done / u.ls.length * 100) + '%"></i></div><ol class="steps"></ol>';
      const list = sec.querySelector(".steps");
      u.ls.forEach(l => {
        const rec = S.lessons[l.id];
        const isNext = next && l.id === next.id;
        const li = document.createElement("li");
        if (rec) li.className = "was-done";
        const sub = isNext ? "다음 레슨 · 약 " + mins(l) + "분" : rec ? "정답률 " + rec.best + "% · " + rec.n + "회 완료" : l.qs.length + "문제";
        li.innerHTML = '<button type="button" class="row' + (rec ? " done" : "") + (isNext ? " next" : "") + '"><span class="disc">' + (rec ? CHECK : l.id) +
          '</span><span class="tx"><b>' + l.id + '장 ' + esc(l.title) + '</b><span>' + sub + '</span></span>' + CHEV + '</button>';
        li.firstChild.addEventListener("click", () => startLesson(l));
        list.appendChild(li);
      });
      host.appendChild(sec);
    });
  }

  // ---------- session ----------
  let sess = null;
  function startLesson(l) {
    sess = { kind: "lesson", lesson: l, steps: [{ t: "concept" }].concat(l.qs.map(q => ({ t: "q", q }))), i: 0, total: l.qs.length + 1, firstTry: {}, correct: 0, xp: 0, retries: {} };
    openSession();
  }
  function startReview() {
    const ids = shuffle(dueCards()).slice(0, 12);
    if (!ids.length) return;
    sess = { kind: "review", steps: ids.map(id => ({ t: "q", q: QMAP[id] })), i: 0, total: ids.length, firstTry: {}, correct: 0, xp: 0, retries: {} };
    openSession();
  }
  function openSession() {
    $("home").hidden = true; $("lesson").hidden = false;
    document.body.style.overflow = "hidden";
    showStep();
  }
  function closeSession() {
    sess = null;
    $("lesson").hidden = true; $("home").hidden = false;
    document.body.style.overflow = "";
    renderHome();
    window.scrollTo(0, 0);
  }
  $("quit").addEventListener("click", closeSession);
  $("review-btn").addEventListener("click", startReview);

  function setProgress() {
    const doneCount = Math.min(sess.i, sess.total);
    $("prog-fill").style.width = Math.round(doneCount / sess.total * 100) + "%";
  }
  function sheet(html, cls) {
    const sh = $("sheet");
    sh.className = "sheet" + (cls ? " " + cls : "");
    $("sheet-inner").innerHTML = html;
    typeset(sh);
  }

  function showStep() {
    setProgress();
    const stage = $("stage");
    $("lesson-body").scrollTop = 0;
    const step = sess.steps[sess.i];
    if (!step) return finish();
    seenTerms = new Set();
    stage.className = "wrap rise";
    void stage.offsetWidth;
    if (step.t === "concept") {
      const l = sess.lesson;
      stage.innerHTML = '<article class="concept"><span class="eyebrow">' + l.id + '장 · 핵심 정리</span><h2>' + esc(l.title) + '</h2><ol>' +
        l.concept.map(c => '<li>' + md(c) + '</li>').join("") + '</ol>' +
        (DRIVE[l.id] ? '<a href="https://drive.google.com/file/d/' + DRIVE[l.id] + '/view" target="_blank" rel="noopener">교재 PDF 열기 →</a>' : "") + '</article>';
      sheet('<button class="btn wide" id="go" type="button">문제 풀기</button>');
      $("go").addEventListener("click", () => { sess.i++; showStep(); });
      typeset(stage);
      return;
    }
    renderQuestion(step.q, stage);
  }

  function renderQuestion(q, stage) {
    const label = sess.kind === "review" ? "복습 · " + q.lesson.id + "장 " + q.lesson.title : q.lesson.id + "장";
    const typeLabel = { mc: "고르기", in: "직접 입력", ord: "순서 맞추기" }[q.type];
    let html = '<span class="eyebrow">' + esc(label) + ' · ' + typeLabel + '</span><p class="qtext">' + md(q.q) + '</p>';
    let getAnswer = null;
    if (q.type === "mc") {
      const opts = shuffle(q.a.map(t => ({ t, ok: true })).concat(q.w.map(t => ({ t, ok: false }))));
      html += '<div class="opts" id="opts" role="radiogroup">' + opts.map((o, i) => '<button type="button" class="opt" role="radio" aria-checked="false" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span class="t">' + mdPlain(o.t) + '</span></button>').join("") + '</div>';
      stage.innerHTML = html;
      let sel = -1;
      stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if ($("opts").classList.contains("locked")) return;
        sel = +b.dataset.i;
        stage.querySelectorAll(".opt").forEach(x => { x.classList.toggle("sel", x === b); x.setAttribute("aria-checked", x === b); });
        $("check").disabled = false;
      }));
      getAnswer = () => {
        const ok = opts[sel].ok;
        $("opts").classList.add("locked");
        stage.querySelectorAll(".opt").forEach((x, i) => { if (opts[i].ok) x.classList.add("right"); else if (i === sel) x.classList.add("wrong"); x.classList.remove("sel"); });
        return ok;
      };
    } else if (q.type === "in") {
      html += '<input class="answer-in" id="ans" inputmode="text" autocomplete="off" placeholder="답 입력" aria-label="답"><div class="hint">정수, 음수(-3), 분수(1/2), 소수 모두 돼요. 소수 답은 1% 오차까지 정답이에요.</div>';
      stage.innerHTML = html;
      const inp = $("ans");
      inp.addEventListener("input", () => { $("check").disabled = !inp.value.trim(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter" && inp.value.trim() && !$("check").disabled) $("check").click(); });
      setTimeout(() => inp.focus({ preventScroll: true }), 50);
      getAnswer = () => { inp.readOnly = true; return checkInput(q, inp.value); };
    } else {
      const pool = shuffle(q.s.map((t, i) => ({ t, i })));
      html += '<div class="slots" id="slots"></div><div class="pool" id="pool">' + pool.map((p, k) => '<button type="button" class="chip" data-k="' + k + '"><span class="t">' + mdPlain(p.t) + '</span></button>').join("") + '</div>';
      stage.innerHTML = html;
      const order = [];
      const slots = $("slots");
      const redraw = () => {
        slots.innerHTML = order.map((k, n) => '<button type="button" class="chip" data-k="' + k + '"><span class="n">' + (n + 1) + '</span><span class="t">' + mdPlain(pool[k].t) + '</span></button>').join("");
        stage.querySelectorAll("#pool .chip").forEach(c => c.classList.toggle("used", order.includes(+c.dataset.k)));
        slots.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { if (slots.dataset.locked) return; order.splice(order.indexOf(+c.dataset.k), 1); redraw(); }));
        $("check").disabled = order.length !== pool.length;
        typeset(slots);
      };
      stage.querySelectorAll("#pool .chip").forEach(c => c.addEventListener("click", () => { if (slots.dataset.locked) return; const k = +c.dataset.k; if (!order.includes(k)) { order.push(k); redraw(); } }));
      getAnswer = () => { slots.dataset.locked = "1"; return order.every((k, n) => pool[k].i === n); };
    }
    typeset(stage);
    sheet('<button class="btn wide" id="check" type="button" disabled>확인</button>');
    $("check").addEventListener("click", () => {
      const ok = getAnswer();
      onAnswer(q, ok);
    });
  }

  function onAnswer(q, ok) {
    const first = !(q.id in sess.firstTry);
    if (first) {
      sess.firstTry[q.id] = ok;
      grade(q.id, ok);
      if (ok) { sess.correct++; sess.xp += 2; }
    } else if (ok) { sess.xp += 1; }
    if (!ok) {
      sess.retries[q.id] = (sess.retries[q.id] || 0) + 1;
      if (sess.retries[q.id] <= 2) { sess.steps.push({ t: "q", q }); sess.total++; }
    }
    let ansHtml = "";
    if (!ok) {
      if (q.type === "in") ansHtml = '<p class="explain"><b>정답:</b> ' + md(q.a[0]) + '</p>';
      if (q.type === "ord") ansHtml = '<p class="explain"><b>올바른 순서:</b><br>' + q.s.map((s, i) => (i + 1) + ". " + md(s)).join("<br>") + '</p>';
    }
    const retryNote = !ok && sess.retries[q.id] <= 2 ? " 이 문제는 레슨 끝에 다시 나와요." : "";
    sheet('<p class="verdict"><i>' + (ok ? CHECK : CROSS) + '</i>' + (ok ? "정답이에요" : "아쉬워요") + '</p>' + ansHtml + (q.e ? '<p class="explain">' + md(q.e) + retryNote + '</p>' : (retryNote ? '<p class="explain">' + retryNote + '</p>' : "")) +
      '<button class="btn wide ' + (ok ? "ok" : "bad") + '" id="next" type="button">계속</button>', ok ? "ok" : "bad");
    const nx = $("next");
    nx.focus({ preventScroll: true });
    nx.addEventListener("click", () => { sess.i++; showStep(); });
  }

  function finish() {
    rollDay();
    const asked = Object.keys(sess.firstTry).length;
    const acc = asked ? Math.round(sess.correct / asked * 100) : 100;
    let bonus = 0;
    if (sess.kind === "lesson") {
      bonus = acc === 100 ? 10 : 5;
      const r = S.lessons[sess.lesson.id] || { n: 0, best: 0 };
      r.n++; r.best = Math.max(r.best, acc);
      S.lessons[sess.lesson.id] = r;
    } else bonus = 3;
    const gained = sess.xp + bonus;
    S.xp += gained; S.dayXp += gained;
    touchStreak();
    persist();
    $("prog-fill").style.width = "100%";
    const stage = $("stage");
    const title = sess.kind === "review" ? "복습 완료" : acc === 100 ? "완벽해요" : "레슨 완료";
    const sub = sess.kind === "review" ? "맞힌 문제는 더 긴 간격 뒤에 다시 나와요." : acc === 100 ? "한 번도 안 틀렸어요. 보너스 10 XP." : "틀린 문제는 복습 목록에 들어갔어요.";
    stage.innerHTML = '<div class="finish"><div class="badge">' + CHECK + '</div><h2>' + title + '</h2><p>' + sub + '</p><div class="tiles">' +
      '<div class="tile xp"><b>+' + gained + '</b><span>XP</span></div>' +
      '<div class="tile acc"><b>' + acc + '%</b><span>첫 시도 정답률</span></div>' +
      '<div class="tile st"><b>' + S.streak + '일</b><span>연속 학습</span></div></div></div>';
    sheet('<button class="btn wide" id="done" type="button">계속</button>');
    $("done").addEventListener("click", closeSession);
  }

  document.addEventListener("keydown", e => {
    if (!sess) return;
    if (/^[1-9]$/.test(e.key) && document.activeElement && document.activeElement.id !== "ans") {
      const b = document.querySelector('#opts:not(.locked) .opt[data-i="' + (+e.key - 1) + '"]');
      if (b) b.click();
    }
    if (e.key === "Enter" && (!document.activeElement || !/^(BUTTON|INPUT|A)$/.test(document.activeElement.tagName))) {
      const b = $("check") || $("next") || $("go") || $("done");
      if (b && !b.disabled && document.activeElement !== b) { e.preventDefault(); b.click(); }
    }
  });

  function openGloss(i) {
    const g = GLOSS[i];
    $("gloss-term").textContent = g.t === "계(order)" ? "계 (order)" : g.t;
    $("gloss-def").innerHTML = esc(g.d);
    $("gloss").hidden = false;
    typeset($("gloss-def"));
    $("gloss-close").focus({ preventScroll: true });
  }
  function closeGloss() { $("gloss").hidden = true; }
  document.addEventListener("click", e => {
    const t = e.target.closest && e.target.closest(".term");
    if (t) { e.stopPropagation(); e.preventDefault(); openGloss(+t.dataset.g); }
  }, true);
  document.addEventListener("keydown", e => {
    const t = e.target.closest && e.target.closest(".term");
    if (t && (e.key === "Enter" || e.key === " ")) { e.stopPropagation(); e.preventDefault(); openGloss(+t.dataset.g); return; }
    if (e.key === "Escape" && !$("gloss").hidden) { e.stopPropagation(); closeGloss(); }
  }, true);
  $("gloss-close").addEventListener("click", closeGloss);
  $("gloss").addEventListener("click", e => { if (e.target.id === "gloss") closeGloss(); });

  renderHome();
  connect();
})();
</script>
